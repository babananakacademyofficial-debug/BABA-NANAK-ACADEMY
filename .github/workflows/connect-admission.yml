name: Connect Admission Form

on:
  push:
    branches: [main]
    paths:
      - 'admission.html'
      - 'courses.json'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect registration buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("onclick=\"openModal('register')\"", "onclick=\"location.href='admission.html'\"")
          s = s.replace("onclick=\"openModal('register')\"", "onclick=\"location.href='admission.html'\"")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Connect registration buttons to admission form'
          git push