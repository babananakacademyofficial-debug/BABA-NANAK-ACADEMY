<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Nanak Academy — Admin</title>
<style>
:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef;--ok:#176b4b;--bad:#a12d4d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}
header{background:var(--n);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.wrap{width:min(1200px,94%);margin:22px auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #082b5d10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea,button,select{font:inherit;padding:11px;border:1px solid #ccd8e5;border-radius:9px}
input,textarea,select{width:100%;background:#fff}button{background:var(--n);color:#fff;border:0;cursor:pointer;font-weight:800}button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#eef5ff;color:var(--n)}.danger{background:#9b1c1c}.hide{display:none!important}.msg{margin-top:12px;padding:12px;border-radius:10px}
.ok{background:#e9f8f2;color:var(--ok)}.err{background:#fff0f3;color:var(--bad)}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.menu button{min-height:82px;text-align:left;background:#fff;color:#17263d;border:1px solid var(--line)}.menu strong{display:block;font-size:15px}.menu small{color:#66758c}
.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #dce4ec;padding:8px;text-align:left;white-space:nowrap}th{background:#eef5ff;color:var(--n)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}
.subject{display:grid;grid-template-columns:140px 1fr 100px 100px 110px;gap:6px;margin:7px 0}.subject.head{font-weight:800;background:#eef5ff;padding:8px;border-radius:8px}.subject>*{min-width:0}
.locked{background:#f2f5f8!important;color:#5d6b7b!important}.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.certbox{border:2px solid #d9e5f2;border-radius:14px;padding:16px;margin-top:14px;background:#fbfdff}.certrow{display:grid;grid-template-columns:180px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #e6edf4}.certrow:last-child{border-bottom:0}.certkey{font-weight:800;color:var(--n)}
@media(max-width:800px){.menu{grid-template-columns:repeat(2,1fr)}.subject{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.certrow{grid-template-columns:1fr}}
@media(max-width:520px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>BABA NANAK ACADEMY</b><span>ADMIN PANEL</span></header>
<main class="wrap">
<section id="login" class="card">
<h2>Admin Login</h2><p>Authorized staff only.</p>
<form id="loginForm"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button type="submit">Login</button></form>
<div id="loginMsg"></div>
</section>
<section id="app" class="hide">
<div class="card"><div class="bar"><div><h2>Admin Dashboard</h2><div id="stats">Loading…</div></div><div class="actions"><button type="button" class="secondary" id="refresh">Refresh</button><button type="button" class="danger" id="logout">Logout</button></div></div></div>
<div class="card"><div class="menu">
<button type="button" data-tab="students">👨‍🎓 <strong>STUDENT</strong><small>Online + manual</small></button>
<button type="button" data-tab="payments">💰 <strong>PAYMENTS</strong><small>Payment records</small></button>
<button type="button" data-tab="fees">💳 <strong>FEE VERIFY</strong><small>Verify / mark paid</small></button>
<button type="button" data-tab="enrollments">📚 <strong>ENROLLMENT</strong><small>Course enrollments</small></button>
<button type="button" data-tab="results">📝 <strong>SUBJECT RESULT</strong><small>Upload once / edit marks</small></button>
<button type="button" data-tab="certificates">🏆 <strong>CERTIFICATE</strong><small>Generate / verify certificate</small></button>
</div></div>
<div id="view" class="card"></div>
</section>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';
const $=id=>document.getElementById(id);
let pw='',data={},uploadBusy=false,certificateBusy=false;
const catalog={'1111':[
['1111-01','Computer Fundamental',100,40],
['1111-02','Desktop Publishing',100,40],
['1111-03','HTML, C++',100,40],
['1111-04','Tally ERP 9.0',100,40],
['1111-05','Typing English/Punjabi',100,40],
['1111-06','Installation Windows, Windows Ghost, Hardware',100,40],
['1111-07','Practical Lab Assignment & Viva-Voce',400,160]
]};
function msg(id,text,type=''){const e=$(id);if(!e)return;e.className=type?'msg '+type:'msg';e.textContent=text}
function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}
async function api(action,extra={}){
const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:Object.assign({password:pw},extra)})});
const text=await res.text();let json;try{json=JSON.parse(text)}catch(e){throw Error('Invalid API response. Apps Script deployment may be old or unavailable.')}
return json;
}
async function login(){
pw=$('password').value.trim();if(!pw){msg('loginMsg','Admin password is required.','err');return}
msg('loginMsg','Checking login…');
try{const r=await api('adminLogin');if(!r.ok){msg('loginMsg',r.message||'Invalid admin password.','err');return}
sessionStorage.setItem('bna_admin_pw',pw);$('login').classList.add('hide');$('app').classList.remove('hide');await loadData();students();}
catch(e){msg('loginMsg','Connection error: '+e.message,'err')}
}
async function loadData(){try{const r=await api('adminData');if(!r.ok){$('stats').textContent=r.message||'Unable to load data.';return}data=r;const count=k=>Array.isArray(r[k])?Math.max(0,r[k].length-1):0;$('stats').textContent='Students: '+count('students')+' • Courses: '+count('courses')+' • Enrollments: '+count('enrollments')+' • Payments: '+count('payments')+' • Results: '+count('results')+' • Certificates: '+count('certificates')}catch(e){$('stats').textContent='Connection error: '+e.message}}
function renderTable(k){const rows=data[k]||[];$('view').innerHTML='<div class="bar"><h3>'+escapeHtml(k.toUpperCase())+'</h3><button type="button" class="secondary" id="tableRefresh">Refresh data</button></div><div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?' <td>':'<th>')+escapeHtml(c)+(i?' </td>':'</th>')).join('')+'</tr>').join('')+'</table></div>';$('tableRefresh').onclick=async()=>{await loadData();renderTable(k)}}
function students(){renderTable('students')}
function feeForm(){$('view').innerHTML='<h3>Fee Verify</h3><div class="grid"><input id="fi" placeholder="Payment ID"><input id="fo" placeholder="Order ID"><input id="fs" placeholder="Student ID"><input id="fc" placeholder="Course ID"><input id="fn" placeholder="Course name"><input id="fa" type="number" placeholder="Amount" value="0"></div><button type="button" id="verifyBtn">Verify / Mark Paid</button><div id="feeMsg"></div><hr><div id="paymentTable"></div>';renderMini('payments','paymentTable');$('verifyBtn').onclick=verifyFee}
function renderMini(k,id){const rows=data[k]||[];$(id).innerHTML='<div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+escapeHtml(c)+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>'}
async function verifyFee(){const btn=$('verifyBtn');btn.disabled=true;msg('feeMsg','Verifying…');try{const r=await api('adminPaymentVerify',{paymentId:$('fi').value.trim(),orderId:$('fo').value.trim(),studentId:$('fs').value.trim(),courseId:$('fc').value.trim(),course:$('fn').value.trim(),amount:$('fa').value});msg('feeMsg',r.message||'Done',r.ok?'ok':'err');if(r.ok){await loadData();renderMini('payments','paymentTable')}}catch(e){msg('feeMsg',e.message,'err')}finally{btn.disabled=false}}
function studentForm(){$('view').innerHTML='<h3>Manual Student</h3><div class="grid"><input id="sn" placeholder="Full Name"><input id="se" type="email" placeholder="Email"><input id="sp" placeholder="Mobile"><input id="sd" type="date"><textarea id="sa" placeholder="Address"></textarea></div><button type="button" id="addBtn">Add Student</button><div id="studentMsg"></div>';$('addBtn').onclick=async()=>{const btn=$('addBtn');btn.disabled=true;try{const r=await api('adminStudentAdd',{name:$('sn').value.trim(),email:$('se').value.trim(),phone:$('sp').value.trim(),dob:$('sd').value,address:$('sa').value.trim()});msg('studentMsg',r.ok?'Student added: '+r.studentId:r.message,r.ok?'ok':'err');if(r.ok)await loadData()}catch(e){msg('studentMsg',e.message,'err')}finally{btn.disabled=false}}}
function resultForm(){
$('view').innerHTML='<div class="bar"><h3>Subject Result</h3><button type="button" class="secondary" id="resultReload">Reload Results</button></div><div class="grid"><input id="rsid" placeholder="Student ID"><input id="rname" placeholder="Student Name"><input id="rcid" placeholder="Course ID" value="1111"><input id="rcourse" placeholder="Course Name" value="ADCA"></div><p class="msg">First upload is one-time. After upload, use EDIT RESULT. Subject ID, Subject, Total and Pass are locked; only Marks can be edited.</p><div class="actions"><button type="button" id="loadSub">Load Subjects</button><button type="button" class="secondary" id="loadExisting">Load Existing Result</button></div><div id="subjects"></div><div class="result-actions"><button type="button" id="upload" class="hide">Upload All Marks</button><button type="button" id="editResult" class="hide secondary">✏️ EDIT RESULT</button><button type="button" id="updateResult" class="hide">UPDATE MARKS</button></div><div id="resultMsg"></div>';
$('loadSub').onclick=loadSubjects;$('loadExisting').onclick=loadExistingResult;$('editResult').onclick=enableEdit;$('updateResult').onclick=updateResults;$('resultReload').onclick=()=>{loadData();resultForm()};
}
async function loadSubjects(){
const id=$('rcid').value.trim();if(!id){msg('resultMsg','Course ID is required.','err');return}
const btn=$('loadSub');btn.disabled=true;$('subjects').innerHTML='<p class="msg">Loading subjects…</p>';
try{let list=[];try{const r=await api('subjects',{courseId:id});if(r.ok&&Array.isArray(r.subjects))list=r.subjects.map(x=>[x.subjectId,x.subject,Number(x.maxMarks),Number(x.minPassMarks)]).filter(x=>x[0]&&x[1])}catch(e){}
if(!list.length&&catalog[id])list=catalog[id];if(!list.length){$('subjects').innerHTML='<p class="msg err">No subjects found for Course ID '+escapeHtml(id)+'.</p>';return}
renderSubjects(list,[]);$('upload').classList.remove('hide');$('editResult').classList.add('hide');$('updateResult').classList.add('hide');
}catch(e){msg('resultMsg',e.message,'err')}finally{btn.disabled=false}}
function renderSubjects(list,scores){$('subjects').innerHTML='<div class="subject head"><span>Subject ID</span><span>Subject</span><span>Total</span><span>Pass</span><span>Marks</span></div>'+list.map((x,i)=>'<div class="subject"><select class="sid locked" disabled><option value="'+escapeAttr(x[0])+'">'+escapeHtml(x[0])+'</option></select><input class="sub locked" value="'+escapeAttr(x[1])+'" readonly><input class="max locked" type="number" value="'+x[2]+'" readonly><input class="min locked" type="number" value="'+x[3]+'" readonly><input class="score" type="number" min="0" max="'+x[2]+'" placeholder="Marks" value="'+(scores[i]==null?'':scores[i])+'"></div>').join('')}
function findStudentName(id){const rows=data.students||[];for(let i=1;i<rows.length;i++)if(String(rows[i][1]).trim().toUpperCase()===id.toUpperCase())return String(rows[i][2]||'');return ''}
function loadExistingResult(){
const sid=$('rsid').value.trim().toUpperCase(),cid=$('rcid').value.trim();if(!sid||!cid){msg('resultMsg','Student ID and Course ID are required.','err');return}
const rows=(data.results||[]).slice(1).filter(r=>String(r[1]).trim().toUpperCase()===sid&&String(r[3]).trim()===cid);
if(!rows.length){msg('resultMsg','No uploaded result found. Load Subjects and use Upload All Marks.','err');return}
$('rname').value=rows[0][2]||findStudentName(sid);$('rcourse').value=rows[0][4]||$('rcourse').value;
let list=catalog[cid]||rows.map(r=>[r[5],r[6],Number(r[8]),Number(r[8])]);let scores=list.map(x=>{const row=rows.find(r=>String(r[5]).trim()===String(x[0]).trim());return row?row[7]:''});
renderSubjects(list,scores);document.querySelectorAll('.score').forEach(e=>e.disabled=true);$('upload').classList.add('hide');$('editResult').classList.remove('hide');$('updateResult').classList.add('hide');msg('resultMsg','Existing result loaded. Click EDIT RESULT to change marks.','ok')
}
function enableEdit(){document.querySelectorAll('.score').forEach(e=>e.disabled=false);$('editResult').classList.add('hide');$('updateResult').classList.remove('hide');msg('resultMsg','EDIT MODE: only Marks are open. Subject ID, Subject, Total and Pass remain locked.','ok')}
function collectResults(){return [...document.querySelectorAll('.subject:not(.head)')].map(r=>({subjectId:r.querySelector('.sid').value,subject:r.querySelector('.sub').value,maxMarks:Number(r.querySelector('.max').value),minPassMarks:Number(r.querySelector('.min').value),score:Number(r.querySelector('.score').value)}))}
async function uploadResults(){if(uploadBusy)return;const sid=$('rsid').value.trim(),cid=$('rcid').value.trim(),name=$('rname').value.trim(),course=$('rcourse').value.trim(),rows=[...document.querySelectorAll('.subject:not(.head)')];if(!sid||!cid){msg('resultMsg','Student ID and Course ID are required.','err');return}if(!rows.length){msg('resultMsg','Load Subjects first.','err');return}if(rows.some(r=>r.querySelector('.score').value==='')){msg('resultMsg','Please enter marks for every subject.','err');return}uploadBusy=true;const btn=$('upload');btn.disabled=true;btn.textContent='Uploading…';try{const r=await api('adminResultBulk',{studentId:sid,name,courseId:cid,course,results:collectResults()});msg('resultMsg',r.message||'Done',r.ok?'ok':'err');if(r.ok){btn.textContent='Uploaded ✓';rows.forEach(r=>r.querySelector('.score').disabled=true);btn.classList.add('hide');$('editResult').classList.remove('hide');await loadData() }else{btn.disabled=false;btn.textContent='Upload All Marks'}}catch(e){msg('resultMsg',e.message,'err');btn.disabled=false;btn.textContent='Upload All Marks'}finally{uploadBusy=false}}
async function updateResults(){if(uploadBusy)return;const sid=$('rsid').value.trim(),cid=$('rcid').value.trim(),name=$('rname').value.trim(),course=$('rcourse').value.trim(),rows=[...document.querySelectorAll('.subject:not(.head)')];if(rows.some(r=>r.querySelector('.score').value==='')){msg('resultMsg','Every subject must have marks.','err');return}uploadBusy=true;const btn=$('updateResult');btn.disabled=true;btn.textContent='Updating…';try{const r=await api('adminResultBulk',{studentId:sid,name,courseId:cid,course,edit:true,results:collectResults()});msg('resultMsg',r.message||'Done',r.ok?'ok':'err');if(r.ok){rows.forEach(r=>r.querySelector('.score').disabled=true);btn.classList.add('hide');$('editResult').classList.remove('hide');await loadData()}}catch(e){msg('resultMsg',e.message,'err')}finally{uploadBusy=false;btn.disabled=false;btn.textContent='UPDATE MARKS'}}
function certificateForm(){
$('view').innerHTML='<h3>Certificate</h3><p class="msg">Enter Student ID and Course ID. Certificate will be generated from the saved result. Existing certificate will be returned instead of creating a duplicate.</p><div class="grid"><input id="csid" placeholder="Student ID"><input id="ccid" placeholder="Course ID" value="1111"></div><div class="actions"><button type="button" id="genCert">GENERATE CERTIFICATE</button><button type="button" class="secondary" id="verifyCert">VERIFY CERTIFICATE</button></div><div id="certMsg"></div><div id="certOutput"></div><hr><div id="certificateTable"></div>';renderMini('certificates','certificateTable');$('genCert').onclick=generateCertificate;$('verifyCert').onclick=verifyCert}
async function generateCertificate(){if(certificateBusy)return;const sid=$('csid').value.trim(),cid=$('ccid').value.trim();if(!sid||!cid){msg('certMsg','Student ID and Course ID are required.','err');return}certificateBusy=true;const btn=$('genCert');btn.disabled=true;btn.textContent='Generating…';try{const r=await api('adminCertificate',{studentId:sid,courseId:cid});if(!r.ok){msg('certMsg',r.message||'Certificate generation failed.','err');$('certOutput').innerHTML='';return}msg('certMsg',r.message||'Certificate generated successfully.', 'ok');showCertificate(r);await loadData();renderMini('certificates','certificateTable')}catch(e){msg('certMsg',e.message,'err')}finally{certificateBusy=false;btn.disabled=false;btn.textContent='GENERATE CERTIFICATE'}}
function showCertificate(r){$('certOutput').innerHTML='<div class="certbox"><div class="certrow"><div class="certkey">Certificate No</div><div>'+escapeHtml(r.certificateNo)+'</div></div><div class="certrow"><div class="certkey">Student ID</div><div>'+escapeHtml(r.studentId)+'</div></div><div class="certrow"><div class="certkey">Name</div><div>'+escapeHtml(r.name)+'</div></div><div class="certrow"><div class="certkey">Course</div><div>'+escapeHtml(r.courseId)+' — '+escapeHtml(r.course)+'</div></div><div class="certrow"><div class="certkey">Grade</div><div>'+escapeHtml(r.grade)+'</div></div><div class="certrow"><div class="certkey">Marks</div><div>'+escapeHtml(r.obtainedMarks)+' / '+escapeHtml(r.totalMarks)+'</div></div><div class="certrow"><div class="certkey">Percentage</div><div>'+escapeHtml(r.percentage)+'%</div></div><div class="certrow"><div class="certkey">Verification</div><div><a href="'+escapeAttr(r.verificationUrl)+'" target="_blank" rel="noopener">Open Verification</a></div></div></div>'}
async function verifyCert(){const no=prompt('Enter Certificate No:');if(!no)return;try{const r=await fetch(API+'?action=verifyCertificate&certificateNo='+encodeURIComponent(no.trim())).then(x=>x.json());if(!r.valid){msg('certMsg',r.message||'Certificate not found.','err');$('certOutput').innerHTML='';return}msg('certMsg','Certificate is VALID.','ok');showCertificate(Object.assign({},r.certificate,{ok:true,message:'Certificate verified successfully.'}))}catch(e){msg('certMsg','Verification error: '+e.message,'err')}}
function tab(k){if(k==='students')return studentForm();if(k==='fees')return feeForm();if(k==='results')return resultForm();if(k==='certificates')return certificateForm();renderTable(k)}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('refresh').onclick=async()=>{await loadData();students()};$('logout').onclick=()=>{sessionStorage.removeItem('bna_admin_pw');pw='';$('password').value='';$('app').classList.add('hide');$('login').classList.remove('hide');msg('loginMsg','Logged out.','ok')};
(function(){const saved=sessionStorage.getItem('bna_admin_pw');if(saved){pw=saved;$('password').value=saved;login()}})();
</script>
</body>
</html>
