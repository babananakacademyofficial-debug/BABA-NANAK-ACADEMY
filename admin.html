<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baba Nanak Academy Admin</title><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#18243a}header{background:#061b3b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1150px;margin:25px auto;padding:0 18px}.card{background:#fff;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}input,button{padding:11px;border:1px solid #ccd6e3;border-radius:8px;margin:4px}button{background:#092a5b;color:#fff;border:0}.hide{display:none}.tabs button{background:#1671c9}.table{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:7px;white-space:nowrap}th{background:#eef5ff}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>Admin Panel</span></header><main><div id='login' class='card'><h2>Admin Login</h2><input id='pass' type='password' placeholder='Admin password'><button onclick='login()'>Login</button><p id='m'></p></div><div id='app' class='hide'><div class='card'><h2>Dashboard</h2><p id='stats'></p><button onclick='load()'>Refresh</button><button onclick='logout()'>Logout</button></div><div class='card tabs'><button onclick='show("students")'>Students</button><button onclick='show("enrollments")'>Enrollments</button><button onclick='show("payments")'>Payments</button><button onclick='show("results")'>Results</button><button onclick='show("certificates")'>Certificates</button></div><div id='view' class='card'></div></div></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let pw='',data=null;async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:Object.assign({password:pw},extra)})});return r.json()}async function login(){pw=document.getElementById('pass').value;const r=await api('adminLogin');if(!r.ok)return document.getElementById('m').textContent=r.message;sessionStorage.setItem('bna_admin','1');document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load()}async function load(){const r=await api('adminData');if(!r.ok)return alert(r.message);data=r;document.getElementById('stats').textContent=`Students: ${r.students.length-1} | Enrollments: ${r.enrollments.length-1} | Payments: ${r.payments.length-1} | Results: ${r.results.length-1} | Certificates: ${r.certificates.length-1}`;show('students')}function show(k){const rows=data[k]||[];document.getElementById('view').innerHTML='<h3>'+k+'</h3><div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+String(c??'')+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}function logout(){sessionStorage.removeItem('bna_admin');location.reload()}</script></body></html>
