<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Admin</title><style>:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef;--ok:#176b4b;--bad:#a12d4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}header{background:var(--n);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.wrap{width:min(1200px,94%);margin:22px auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #082b5d10}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea,button,select{font:inherit;padding:11px;border:1px solid #ccd8e5;border-radius:9px}input,textarea,select{width:100%;background:#fff}button{background:var(--n);color:#fff;border:0;cursor:pointer;font-weight:800}.secondary{background:#eef5ff;color:var(--n)}.danger{background:#9b1c1c}.hide{display:none!important}.msg{margin-top:12px;padding:12px;border-radius:10px}.ok{background:#e9f8f2;color:var(--ok)}.err{background:#fff0f3;color:var(--bad)}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.menu button{min-height:82px;text-align:left;background:#fff;color:#17263d;border:1px solid var(--line)}.menu strong{display:block;font-size:15px}.menu small{color:#66758c}.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #dce4ec;padding:8px;text-align:left;white-space:nowrap}th{background:#eef5ff;color:var(--n)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.subject{display:grid;grid-template-columns:140px 1fr 100px 100px 110px;gap:6px;margin:7px 0}.subject.head{font-weight:800;background:#eef5ff;padding:8px;border-radius:8px}.subject>*{min-width:0}@media(max-width:800px){.menu{grid-template-columns:repeat(2,1fr)}.subject{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.menu{grid-template-columns:1fr}}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>ADMIN PANEL</span></header><main class="wrap"><section id="login" class="card"><h2>Admin Login</h2><p>Authorized staff only.</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button type="submit">Login</button></form><div id="loginMsg"></div></section><section id="app" class="hide"><div class="card"><div class="bar"><div><h2>Admin Dashboard</h2><div id="stats">Loading…</div></div><div class="actions"><button class="secondary" id="refresh">Refresh</button><button class="danger" id="logout">Logout</button></div></div></div><div class="card"><div class="menu"><button data-tab="students">👨‍🎓 <strong>STUDENT</strong><small>Online + manual</small></button><button data-tab="payments">💰 <strong>PAYMENTS</strong><small>Payment records</small></button><button data-tab="fees">💳 <strong>FEE VERIFY</strong><small>Verify / mark paid</small></button><button data-tab="enrollments">📚 <strong>ENROLLMENT</strong><small>Course enrollments</small></button><button data-tab="results">📝 <strong>SUBJECT RESULT</strong><small>Subject marks</small></button><button data-tab="certificates">🏆 <strong>CERTIFICATE</strong><small>Certificate records</small></button></div></div><div id="view" class="card"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const $=id=>document.getElementById(id);let pw='',data={};const catalog={'1111':[['1111-01','Computer Fundamental',100,40],['1111-02','Desktop Publishing',100,40],['1111-03','HTML, C++',100,40],['1111-04','Tally ERP 9.0',100,40],['1111-05','Typing English/Punjabi',100,40],['1111-06','Installation Windows, Windows Ghost, Hardware',100,40],['1111-07','Practical Lab Assignment & Viva-Voce',400,160]]};function showMsg(text,type=''){const e=$('loginMsg');e.className=type?'msg '+type:'msg';e.textContent=text}async function api(action,extra={}){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:Object.assign({password:pw},extra)})});const text=await res.text();let json;try{json=JSON.parse(text)}catch(e){throw Error('Invalid API response. Check Apps Script deployment.')}return json}async function login(){pw=$('password').value.trim();if(!pw){showMsg('Admin password is required.','err');return}showMsg('Checking login…');try{const r=await api('adminLogin');if(!r.ok){showMsg(r.message||'Invalid admin password.','err');return}sessionStorage.setItem('bna_admin_pw',pw);$('login').classList.add('hide');$('app').classList.remove('hide');await loadData();students()}catch(e){showMsg('Connection error: '+e.message,'err')}}async function loadData(){try{const r=await api('adminData');if(!r.ok){$('stats').textContent=r.message||'Unable to load data.';return}data=r;const count=k=>Array.isArray(r[k])?Math.max(0,r[k].length-1):0;$('stats').textContent='Students: '+count('students')+' • Courses: '+count('courses')+' • Enrollments: '+count('enrollments')+' • Payments: '+count('payments')+' • Results: '+count('results')+' • Certificates: '+count('certificates')}catch(e){$('stats').textContent='Connection error: '+e.message}}function students(){renderTable('students')}function renderTable(k){const rows=data[k]||[];$('view').innerHTML='<div class="bar"><h3>'+escapeHtml(k.toUpperCase())+'</h3><button class="secondary" data-back>Refresh data</button></div><div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?' <td>':'<th>')+escapeHtml(c)+(i?' </td>':'</th>')).join('')+'</tr>').join('')+'</table></div>';$('view').querySelector('[data-back]').onclick=async()=>{await loadData();renderTable(k)}}function feeForm(){$('view').innerHTML='<h3>Fee Verify</h3><div class="grid"><input id="fi" placeholder="Payment ID"><input id="fo" placeholder="Order ID"><input id="fs" placeholder="Student ID"><input id="fc" placeholder="Course ID"><input id="fn" placeholder="Course name"><input id="fa" type="number" placeholder="Amount"></div><button id="verifyBtn">Verify / Mark Paid</button><div id="feeMsg"></div><hr><div id="paymentTable"></div>';renderMini('payments','paymentTable');$('verifyBtn').onclick=verifyFee}function renderMini(k,id){const rows=data[k]||[];$(id).innerHTML='<div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+escapeHtml(c)+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>'}async function verifyFee(){const m=$('feeMsg'),btn=$('verifyBtn');btn.disabled=true;m.className='msg';m.textContent='Verifying…';try{const r=await api('adminPaymentVerify',{paymentId:$('fi').value.trim(),orderId:$('fo').value.trim(),studentId:$('fs').value.trim(),courseId:$('fc').value.trim(),course:$('fn').value.trim(),amount:$('fa').value});m.className=r.ok?'msg ok':'msg err';m.textContent=r.message||'Done';if(r.ok){await loadData();renderMini('payments','paymentTable')}}catch(e){m.className='msg err';m.textContent=e.message}finally{btn.disabled=false}}function studentForm(){$('view').innerHTML='<h3>Manual Student</h3><div class="grid"><input id="sn" placeholder="Full Name"><input id="se" type="email" placeholder="Email"><input id="sp" placeholder="Mobile"><input id="sd" type="date"><textarea id="sa" placeholder="Address"></textarea></div><button id="addBtn">Add Student</button><div id="studentMsg"></div>';$('addBtn').onclick=async()=>{const m=$('studentMsg');try{const r=await api('adminStudentAdd',{name:$('sn').value.trim(),email:$('se').value.trim(),phone:$('sp').value.trim(),dob:$('sd').value,address:$('sa').value.trim()});m.className=r.ok?'msg ok':'msg err';m.textContent=r.ok?'Student added: '+r.studentId:r.message;if(r.ok)await loadData()}catch(e){m.className='msg err';m.textContent=e.message}}}function resultForm(){$('view').innerHTML='<h3>Subject Result</h3><div class="grid"><input id="rsid" placeholder="Student ID"><input id="rname" placeholder="Student Name"><input id="rcid" placeholder="Course ID" value="1111"><input id="rcourse" placeholder="Course Name"></div><p class="msg">For ADCA, Course ID <b>1111</b> loads the 7 predefined subjects with Subject IDs.</p><button id="loadSub">Load Subjects</button><div id="subjects"></div><button id="upload" class="hide">Upload All Marks</button><div id="resultMsg"></div>';$('loadSub').onclick=loadSubjects;$('upload').onclick=uploadResults}async function loadSubjects(){const input=$('rcid');const id=input.value.trim().replace(/[^0-9]/g,'');input.value=id;const box=$('subjects');const btn=$('loadSub');btn.disabled=true;box.innerHTML='<p class="msg">Loading subjects…</p>';try{let list=[];try{const r=await api('subjects',{courseId:id});if(r.ok&&Array.isArray(r.subjects))list=r.subjects.map(x=>[x.subjectId,x.subject,Number(x.maxMarks),Number(x.minPassMarks)]).filter(x=>x[0]&&x[1])}catch(e){}if(!list.length&&catalog[id])list=catalog[id];if(!list.length){box.innerHTML='<p class="msg err">No subjects found for Course ID '+escapeHtml(id)+'. For ADCA use Course ID 1111.</p>';$('upload').classList.add('hide');return}box.innerHTML='<div class="subject head"><span>Subject ID</span><span>Subject</span><span>Total</span><span>Pass</span><span>Marks</span></div>'+list.map(x=>'<div class="subject"><select class="sid"><option value="'+escapeAttr(x[0])+'">'+escapeHtml(x[0])+'</option></select><input class="sub" value="'+escapeAttr(x[1])+'"><input class="max" type="number" value="'+x[2]+'" readonly><input class="min" type="number" value="'+x[3]+'" readonly><input class="score" type="number" min="0" max="'+x[2]+'" placeholder="Marks"></div>').join('');$('upload').classList.remove('hide')}finally{btn.disabled=false}}async function uploadResults(){const studentId=$('rsid').value.trim();const courseId=$('rcid').value.trim();const name=$('rname').value.trim();const course=$('rcourse').value.trim();const rows=[...document.querySelectorAll('.subject:not(.head)')];const m=$('resultMsg');if(!studentId||!courseId){m.className='msg err';m.textContent='Student ID and Course ID are required.';return}const results=rows.map(r=>({subjectId:r.querySelector('.sid').value,subject:r.querySelector('.sub').value,maxMarks:Number(r.querySelector('.max').value),minPassMarks:Number(r.querySelector('.min').value),score:Number(r.querySelector('.score').value||0)}));try{const r=await api('adminResultBulk',{studentId,name,courseId,course,results});m.className=r.ok?'msg ok':'msg err';m.textContent=r.message||'Done';if(r.ok)await loadData()}catch(e){m.className='msg err';m.textContent=e.message}}function tab(k){if(k==='students')return studentForm();if(k==='fees')return feeForm();if(k==='results')return resultForm();renderTable(k)}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}$('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('refresh').onclick=async()=>{await loadData();students()};$('logout').onclick=()=>{sessionStorage.removeItem('bna_admin_pw');location.reload()};(function(){const saved=sessionStorage.getItem('bna_admin_pw');if(saved){$('password').value=saved;pw=saved;login()}})();</script></body></html>
