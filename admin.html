<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy | Admin</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f8fc;color:#14233b}.top{background:#082b5d;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{width:min(1180px,92%);margin:25px auto}.box{background:#fff;border:1px solid #dce6f2;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f7faff;padding:16px;border-radius:13px}.stat b{display:block;font-size:27px;color:#082b5d}.muted{color:#66758c;font-size:13px}button,input{font:inherit}.btn{padding:10px 14px;border-radius:10px;border:0;font-weight:800;cursor:pointer}.primary{background:#082b5d;color:#fff}.gold{background:#f4b63f}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:11px;border:1px solid #ccd9e8;border-radius:10px}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e3eaf2;text-align:left;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto}}</style></head><body><header class="top"><b>BABA NANAK ACADEMY • ADMIN</b><button class="btn gold" id="logout">Logout</button></header><main class="wrap"><section id="login" class="box"><h2>Admin Login</h2><form id="form"><div class="field"><label>Email</label><input name="email" type="email" placeholder="admin email" required></div><div class="field"><label>Password</label><input name="password" type="password" placeholder="admin password" required></div><button class="btn primary">Login</button><p class="muted">Admin credentials are supplied through the backend environment variables.</p></form></section><section id="app" class="hidden"><div class="grid"><div class="stat"><b id="students">0</b><span>Students</span></div><div class="stat"><b id="enrollments">0</b><span>Enrollments</span></div><div class="stat"><b id="paid">₹0</b><span>Paid Revenue</span></div><div class="stat"><b id="certificates">0</b><span>Certificates</span></div></div><div class="tabs"><button class="btn primary" onclick="show('studentsTab')">Students</button><button class="btn gold" onclick="show('enrollTab')">Enrollments</button><button class="btn gold" onclick="show('resultsTab')">Results</button></div><div id="studentsTab" class="box"></div><div id="enrollTab" class="box hidden"></div><div id="resultsTab" class="box hidden"></div></section></main><script>let API=localStorage.getItem('bna_api')||'http://localhost:3000',TOKEN=localStorage.getItem('bna_admin_token')||'';const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN}});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}function show(id){['studentsTab','enrollTab','resultsTab'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}async function load(){try{const s=await api('/api/admin/stats');$('#students').textContent=s.students;$('#enrollments').textContent=s.enrollments;$('#paid').textContent='₹'+Number(s.paid).toLocaleString('en-IN');$('#certificates').textContent=s.certificates;const st=await api('/api/admin/students');$('#studentsTab').innerHTML='<h2>Students</h2><table class="table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Created</th></tr>'+st.students.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.phone||''}</td><td>${x.created_at}</td></tr>`).join('')+'</table>';const en=await api('/api/admin/enrollments');$('#enrollTab').innerHTML='<h2>Enrollments</h2><table class="table"><tr><th>Student</th><th>Course</th><th>Status</th><th>Date</th></tr>'+en.enrollments.map(x=>`<tr><td>${x.student_name}</td><td>${x.course_name}</td><td>${x.status}</td><td>${x.enrolled_at}</td></tr>`).join('')+'</table>';const re=await api('/api/admin/results');$('#resultsTab').innerHTML='<h2>Results</h2><table class="table"><tr><th>Student</th><th>Course</th><th>Score</th><th>%</th><th>Status</th></tr>'+re.results.map(x=>`<tr><td>${x.student_name}</td><td>${x.course_name}</td><td>${x.score}/${x.total}</td><td>${x.percentage}</td><td>${x.passed?'PASS':'FAIL'}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}$('#form').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();if(!r.ok)throw Error(x.message);TOKEN=x.token;localStorage.setItem('bna_admin_token',TOKEN);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(x){alert(x.message)}};$('#logout').onclick=()=>{localStorage.removeItem('bna_admin_token');location.reload()};if(TOKEN){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}</script></body></html>
