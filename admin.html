<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baba Nanak Academy Admin</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f8fc;color:#18243a}header{background:#061b3b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}input,select,textarea,button{padding:10px;border:1px solid #ccd6e3;border-radius:8px;margin:4px;box-sizing:border-box}button{background:#092a5b;color:#fff;border:0;cursor:pointer;font-weight:700}.admin-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.menu-btn{min-height:76px;background:#fff;color:#18243a;border:1px solid #d9e2ef;box-shadow:0 3px 12px #0001;text-align:left;padding:14px;border-radius:12px;font-size:14px}.menu-btn:hover{border-color:#1671c9;transform:translateY(-1px)}.menu-icon{font-size:24px;display:block;margin-bottom:7px}.menu-title{font-weight:700;display:block}.menu-sub{font-size:11px;color:#667085;display:block;margin-top:3px}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:7px;white-space:nowrap}th{background:#eef5ff}.subject-head,.subject-row{display:grid;grid-template-columns:150px 1fr 110px 130px 130px;gap:5px;align-items:center;margin:6px 0}.subject-head{font-weight:700;font-size:12px;background:#eef5ff;padding:8px;border-radius:7px}.subject-row input,.subject-row select{width:auto}.note{background:#eef7ff;padding:10px;border-radius:9px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head h2,.section-head h3{margin:0}.danger{background:#9b1c1c}@media(max-width:900px){.admin-menu{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.subject-row,.subject-head{grid-template-columns:1fr}.admin-menu{grid-template-columns:1fr}header{gap:10px;flex-wrap:wrap}}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>ADMIN PANEL</span></header><main class='wrap'><div id='login' class='card'><h2>Admin Login</h2><input id='pass' type='password' placeholder='Admin password'><button onclick='login()'>Login</button><p id='msg'></p></div><div id='app' class='hide'><div class='card'><div class='section-head'><div><h2>Admin Dashboard</h2><p id='stats'></p></div><div><button onclick='loadData()'>Refresh</button><button class='danger' onclick='logout()'>Logout</button></div></div></div><div class='card'><h3>Management Menu</h3><div class='admin-menu'><button class='menu-btn' onclick="tab('students')"><span class='menu-icon'>👨‍🎓</span><span class='menu-title'>STUDENT</span><span class='menu-sub'>Online + manual students</span></button><button class='menu-btn' onclick="table('payments')"><span class='menu-icon'>💰</span><span class='menu-title'>PAYMENTS</span><span class='menu-sub'>View payment records</span></button><button class='menu-btn' onclick="tab('fees')"><span class='menu-icon'>💳</span><span class='menu-title'>FEE VERIFY</span><span class='menu-sub'>Verify student payments</span></button><button class='menu-btn' onclick="table('enrollments')"><span class='menu-icon'>📚</span><span class='menu-title'>ENROLLMENT</span><span class='menu-sub'>View course enrollments</span></button><button class='menu-btn' onclick="tab('results')"><span class='menu-icon'>📝</span><span class='menu-title'>SUBJECT RESULT</span><span class='menu-sub'>Subject-wise marks</span></button><button class='menu-btn' onclick="table('certificates')"><span class='menu-icon'>🏆</span><span class='menu-title'>CERTIFICATE</span><span class='menu-sub'>View certificate records</span></button></div></div><div id='view' class='card'></div></div></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let pw='',data={};const subjectCatalog={'1111':{course:'ADCA',subjects:[['1111-01','Computer Fundamental',100,40],['1111-02','Desktop Publishing',100,40],['1111-03','HTML, C++',100,40],['1111-04','Tally ERP 9.0',100,40],['1111-05','Typing English/Punjabi',100,40],['1111-06','Installation Windows, Windows Ghost, Hardware',100,40],['1111-07','Practical Lab Assignment & Viva-Voce',400,160]]}};async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:Object.assign({password:pw},extra)})});return r.json()}async function login(){pw=document.getElementById('pass').value;const r=await api('adminLogin');if(!r.ok){msg.textContent=r.message;return}document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');await loadData();tab('students')}async function loadData(){const r=await api('adminData');if(!r.ok){alert(r.message);return}data=r;stats.textContent='Students: '+(r.students.length-1)+' | Courses: '+(r.courses.length-1)+' | Enrollments: '+(r.enrollments.length-1)+' | Payments: '+(r.payments.length-1)+' | Results: '+(r.results.length-1)+' | Certificates: '+(r.certificates.length-1)}function tab(k){if(k==='students')return studentForm();if(k==='fees')return feeForm();if(k==='results')return resultForm();table(k)}function table(k){const rows=data[k]||[];view.innerHTML='<h3>'+k+'</h3><div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+escapeHtml(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}function studentForm(){view.innerHTML=`<h3>Manual Student Add</h3><div class='grid'><input id='sn' placeholder='Full Name'><input id='se' placeholder='Email'><input id='sp' placeholder='Mobile'><input id='sd' type='date'><textarea id='sa' placeholder='Address'></textarea></div><button onclick='addStudent()'>Add Student</button><p id='sm'></p><hr><button onclick="table('students')">View Online + Manual Students</button>`}async function addStudent(){const r=await api('adminStudentAdd',{name:sn.value,email:se.value,phone:sp.value,dob:sd.value,address:sa.value});sm.textContent=r.ok?'Student added: '+r.studentId:r.message;if(r.ok)await loadData()}function feeForm(){view.innerHTML=`<h3>Fee / Payment Verification</h3><div class='grid'><input id='fi' placeholder='Payment ID'><input id='fo' placeholder='Order ID'><input id='fs' placeholder='Student ID'><input id='fc' placeholder='Course ID'><input id='fn' placeholder='Course name'><input id='fa' type='number' placeholder='Amount'></div><button onclick='verifyFee()'>Verify / Mark Paid</button><p id='fm2'></p><hr><button onclick="table('payments')">View All Online Payments</button>`}async function verifyFee(){const r=await api('adminPaymentVerify',{paymentId:fi.value,orderId:fo.value,studentId:fs.value,courseId:fc.value,course:fn.value,amount:fa.value});fm2.textContent=r.message;if(r.ok)await loadData()}function resultForm(){view.innerHTML=`<h3>Subject Result / Marks</h3><div class='grid'><input id='rsid' placeholder='Student ID'><input id='rname' placeholder='Student Name'><input id='rcid' placeholder='Course ID (e.g. 1111)'><input id='rcourse' placeholder='Course Name'></div><div class='note'>Enter Course ID and click <b>Load Subjects</b>. Subject IDs will open in a dropdown. No Exam ID is required.</div><button onclick='loadSubjects()'>Load Subjects</button><div class='subject-head'><div>SUBJECT ID ▼</div><div>SUBJECT</div><div>MAX MARKS</div><div>MIN PASS</div><div>MARKS OBTAINED</div></div><div id='subjectRows'></div><button onclick='addCustomSubject()'>+ Add Custom Subject</button> <button onclick='uploadResults()'>Upload All Marks</button><p id='rm'></p><hr><button onclick="table('results')">View Results</button>`}function loadSubjects(){const c=subjectCatalog[String(rcid.value).trim()];if(!c){subjectRows.innerHTML='<p class="note">No predefined subjects for this Course ID. Add custom subjects below.</p>';return}if(!rcourse.value)rcourse.value=c.course;subjectRows.innerHTML=c.subjects.map(x=>row(x[0],x[1],x[2],x[3],c.subjects)).join('')}function row(id,name,max,min,options=[]){const opts=options.map(x=>`<option value='${escapeAttr(x[0])}' ${x[0]===id?'selected':''}>${escapeHtml(x[0])}</option>`).join('');return `<div class='subject-row'><select class='sid'>${opts||`<option value='${escapeAttr(id)}'>${escapeHtml(id)}</option>`}</select><input class='sub' value='${escapeAttr(name)}'><input class='max' type='number' value='${max}'><input class='min' type='number' value='${min}'><input class='score' type='number' min='0' max='${max}' placeholder='Obtained'></div>`}function addCustomSubject(){subjectRows.insertAdjacentHTML('beforeend',row('CUSTOM-'+(document.querySelectorAll('.sid').length+1),'',100,40))}async function uploadResults(){const ids=[...document.querySelectorAll('.sid')],subs=[...document.querySelectorAll('.sub')],maxs=[...document.querySelectorAll('.max')],mins=[...document.querySelectorAll('.min')],scores=[...document.querySelectorAll('.score')];const results=subs.map((x,i)=>({subjectId:ids[i].value,subject:x.value,maxMarks:Number(maxs[i].value),minPassMarks:Number(mins[i].value),score:Number(scores[i].value)})).filter(x=>x.subject);const total=results.reduce((a,x)=>a+x.maxMarks,0),obtained=results.reduce((a,x)=>a+x.score,0),minPass=results.reduce((a,x)=>a+x.minPassMarks,0);if(results.some(x=>x.score>x.maxMarks)){rm.textContent='Error: Marks obtained cannot exceed maximum marks.';return}const r=await api('adminResultBulk',{studentId:rsid.value,name:rname.value,courseId:rcid.value,course:rcourse.value,totalMarks:total,results});rm.textContent=r.ok?r.message+' Total: '+obtained+'/'+total+' ('+(total?((obtained/total)*100).toFixed(2):'0')+'%) — '+(obtained>=minPass?'PASS':'FAIL'):r.message;if(r.ok)await loadData()}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}function logout(){location.reload()}</script></body></html>
