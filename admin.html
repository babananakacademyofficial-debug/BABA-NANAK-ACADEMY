<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Admin</title><style>:root{--n:#082b5d;--bg:#f4f7fb;--line:#dbe5ef}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#17263d}header{background:var(--n);color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{width:min(1200px,94%);margin:22px auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}input,textarea,button,select{font:inherit;padding:11px;border:1px solid #ccd8e5;border-radius:9px}input,textarea,select{width:100%}button{background:var(--n);color:#fff;border:0;cursor:pointer;font-weight:800}.secondary{background:#eef5ff;color:var(--n)}.danger{background:#9b1c1c}.hide{display:none!important}.msg{margin-top:12px;padding:12px;border-radius:10px}.ok{background:#e9f8f2;color:#176b4b}.err{background:#fff0f3;color:#a12d4d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.menu button{min-height:75px;background:#fff;color:#17263d;border:1px solid var(--line);text-align:left}.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #dce4ec;padding:8px;text-align:left}th{background:#eef5ff}.bar,.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.subject{display:grid;grid-template-columns:140px 1fr 90px 90px 110px;gap:6px;margin:7px 0}.subject.head{font-weight:800;background:#eef5ff;padding:8px;border-radius:8px}.locked{background:#f2f5f8!important}.certificate-preview{background:#fffef6;border:8px double #cda33c;padding:34px;margin-top:18px;text-align:center;box-shadow:0 12px 35px #0001;font-family:Georgia,serif}.cert-head{font:900 26px Arial;color:#082b5d}.cert-title{font-size:34px;font-weight:900;color:#082b5d;margin:22px 0 10px}.cert-title span{font-size:24px}.cert-name{font-size:34px;font-weight:900;margin:10px}.certificate-preview h4{font:900 18px Arial;color:#082b5d;margin:24px 0 8px}.cert-marks{font-family:Arial;font-size:12px;margin:0 auto;width:100%}.cert-total{margin:14px 0;font:700 15px Arial}.cert-no{margin-top:16px;font:600 13px Arial}.qr-wrap{margin:20px auto 0;text-align:center;font-family:Arial}.qr-wrap img{width:125px;height:125px;border:5px solid #fff;box-shadow:0 2px 8px #0002}.qr-label{font-size:11px;margin-top:5px;color:#555}@media(max-width:800px){.menu{grid-template-columns:1fr 1fr}.grid,.subject{grid-template-columns:1fr}}@media(max-width:520px){.menu{grid-template-columns:1fr}}@media print{body *{visibility:hidden}.certificate-preview,.certificate-preview *{visibility:visible}.certificate-preview{position:absolute;left:0;top:0;width:100%;margin:0;box-shadow:none}}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>ADMIN PANEL</span></header><main class="wrap"><section id="login" class="card"><h2>Admin Login</h2><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><br><br><button>LOGIN</button></form><div id="loginMsg"></div></section><section id="app" class="hide"><div class="card"><div class="bar"><div><h2>Admin Dashboard</h2><div id="stats"></div></div><div><button id="refresh" class="secondary">Refresh</button> <button id="logout" class="danger">Logout</button></div></div></div><div class="card"><div class="menu"><button data-tab="students">👨‍🎓 STUDENT</button><button data-tab="payments">💰 PAYMENTS</button><button data-tab="fees">💳 FEE VERIFY</button><button data-tab="enrollments">📚 ENROLLMENT</button><button data-tab="results">📝 SUBJECT RESULT</button><button data-tab="certificates">🏆 CERTIFICATE</button></div></div><div id="view" class="card"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const $=id=>document.getElementById(id);let pw='',data={};const catalog={'1111':[['1111-01','Computer Fundamental',100,40],['1111-02','Desktop Publishing',100,40],['1111-03','HTML, C++',100,40],['1111-04','Tally ERP 9.0',100,40],['1111-05','Typing English/Punjabi',100,40],['1111-06','Installation Windows, Windows Ghost, Hardware',100,40],['1111-07','Practical Lab Assignment & Viva-Voce',400,160]]};function msg(id,t,c=''){if($(id)){ $(id).className=c?'msg '+c:'msg';$(id).textContent=t}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}async function api(a,x={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,data:{password:pw,...x}})});return r.json()}$('loginForm').onsubmit=async e=>{e.preventDefault();pw=$('password').value.trim();try{const r=await api('adminLogin');if(!r.ok)return msg('loginMsg',r.message,'err');$('login').classList.add('hide');$('app').classList.remove('hide');await loadData();studentTable()}catch(e){msg('loginMsg',e.message,'err')}};$('refresh').onclick=async()=>{await loadData();studentTable()};$('logout').onclick=()=>location.reload();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));async function loadData(){const r=await api('adminData');if(!r.ok)return alert(r.message);data=r;const n=k=>Math.max(0,(r[k]||[]).length-1);$('stats').textContent=`Students: ${n('students')} • Courses: ${n('courses')} • Enrollments: ${n('enrollments')} • Payments: ${n('payments')} • Results: ${n('results')} • Certificates: ${n('certificates')}`}function openTab(k){if(k==='students')return studentForm();if(k==='fees')return feeForm();if(k==='results')return resultForm();if(k==='certificates')return certificateForm();renderTable(k)}function studentTable(){renderTable('students')}function renderTable(k){const rows=data[k]||[];$('view').innerHTML=`<h3>${esc(k.toUpperCase())}</h3><div class="table"><table>${rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+esc(c)+(i?'</td>':'</th>')).join('')+'</tr>').join('')}</table></div>`}function studentForm(){$('view').innerHTML='<h3>Manual Student</h3><div class="grid"><input id="sn" placeholder="Full Name"><input id="se" type="email" placeholder="Email"><input id="sp" placeholder="Mobile"><input id="sd" type="date"><textarea id="sa" placeholder="Address"></textarea></div><button id="addStudent">ADD STUDENT</button><div id="studentMsg"></div>';$('addStudent').onclick=async()=>{try{const r=await api('adminStudentAdd',{name:$('sn').value,email:$('se').value,phone:$('sp').value,dob:$('sd').value,address:$('sa').value});msg('studentMsg',r.ok?'Student added: '+r.studentId:r.message,r.ok?'ok':'err');if(r.ok)await loadData()}catch(e){msg('studentMsg',e.message,'err')}}}function feeForm(){$('view').innerHTML='<h3>Fee / Payment Verification</h3><div class="grid"><input id="fi" placeholder="Payment ID"><input id="fo" placeholder="Order ID"><input id="fs" placeholder="Student ID"><input id="fc" placeholder="Course ID"><input id="fn" placeholder="Course name"><input id="fa" type="number" value="0" placeholder="Amount"></div><button id="verify">VERIFY / MARK PAID</button><div id="feeMsg"></div>';$('verify').onclick=async()=>{try{const r=await api('adminPaymentVerify',{paymentId:$('fi').value,orderId:$('fo').value,studentId:$('fs').value,courseId:$('fc').value,course:$('fn').value,amount:$('fa').value});msg('feeMsg',r.message,r.ok?'ok':'err');if(r.ok)await loadData()}catch(e){msg('feeMsg',e.message,'err')}}}function resultForm(){$('view').innerHTML='<div class="bar"><h3>Subject Result / Marks</h3><button id="loadExisting" class="secondary">LOAD EXISTING</button></div><div class="grid"><input id="rsid" placeholder="Student ID"><input id="rname" placeholder="Student Name"><input id="rcid" value="1111" placeholder="Course ID"><input id="rcourse" value="ADCA" placeholder="Course Name"></div><br><button id="loadSub">LOAD SUBJECTS</button><div id="subjects"></div><button id="upload" class="hide">UPLOAD ALL MARKS</button> <button id="edit" class="hide secondary">EDIT RESULT</button> <button id="update" class="hide">UPDATE MARKS</button><div id="resultMsg"></div>';$('loadSub').onclick=loadSubjects;$('loadExisting').onclick=loadExisting;$('edit').onclick=()=>{document.querySelectorAll('.score').forEach(x=>x.disabled=false);$('edit').classList.add('hide');$('update').classList.remove('hide')};$('update').onclick=updateResults}async function loadSubjects(){const id=$('rcid').value.trim();let list=[];try{const r=await api('subjects',{courseId:id});if(r.ok)list=r.subjects.map(x=>[x.subjectId,x.subject,Number(x.maxMarks),Number(x.minPassMarks)])}catch(e){}if(!list.length)list=catalog[id]||[];if(!list.length)return msg('resultMsg','No subjects found.','err');$('subjects').innerHTML='<div class="subject head"><span>Subject ID</span><span>Subject</span><span>Total</span><span>Pass</span><span>Marks</span></div>'+list.map(x=>`<div class="subject"><input class="sid locked" readonly value="${esc(x[0])}"><input class="sub locked" readonly value="${esc(x[1])}"><input class="max locked" readonly type="number" value="${x[2]}"><input class="min locked" readonly type="number" value="${x[3]}"><input class="score" type="number" min="0" max="${x[2]}" placeholder="Marks"></div>`).join('');$('upload').classList.remove('hide');msg('resultMsg','Enter marks for every subject.','ok')}function collect(){return[...document.querySelectorAll('.subject')].filter(x=>x.querySelector('.sid')).map(x=>({subjectId:x.querySelector('.sid').value,subject:x.querySelector('.sub').value,maxMarks:Number(x.querySelector('.max').value),minPassMarks:Number(x.querySelector('.min').value),score:x.querySelector('.score').value===''?NaN:Number(x.querySelector('.score').value)}))}async function uploadResults(){const rows=collect(),sid=$('rsid').value.trim(),cid=$('rcid').value.trim();if(!sid||!cid)return msg('resultMsg','Student ID and Course ID are required.','err');if(!rows.length||rows.some(x=>!Number.isFinite(x.score)))return msg('resultMsg','Enter marks for every subject.','err');if(rows.some(x=>x.score<0||x.score>x.maxMarks))return msg('resultMsg','Marks cannot exceed maximum marks.','err');try{const r=await api('adminResultBulk',{studentId:sid,name:$('rname').value.trim(),courseId:cid,course:$('rcourse').value.trim(),results:rows});msg('resultMsg',r.ok?'✓ '+r.message:r.message,r.ok?'ok':'err');if(r.ok){await loadData();$('upload').classList.add('hide')}}catch(e){msg('resultMsg',e.message,'err')}}$('view').addEventListener('click',e=>{if(e.target.id==='upload')uploadResults()});function loadExisting(){const sid=$('rsid').value.trim().toUpperCase(),cid=$('rcid').value.trim(),rows=(data.results||[]).slice(1).filter(r=>String(r[1]).trim().toUpperCase()===sid&&String(r[3]).trim()===cid);if(!rows.length)return msg('resultMsg','No result found.','err');$('rname').value=rows[0][2]||'';$('rcourse').value=rows[0][4]||$('rcourse').value;const list=catalog[cid]||rows.map(r=>[r[5],r[6],Number(r[8]),40]);$('subjects').innerHTML='<div class="subject head"><span>Subject ID</span><span>Subject</span><span>Total</span><span>Pass</span><span>Marks</span></div>'+list.map(x=>{const r=rows.find(z=>String(z[5]).trim()===x[0]);return`<div class="subject"><input class="sid locked" readonly value="${esc(x[0])}"><input class="sub locked" readonly value="${esc(x[1])}"><input class="max locked" readonly value="${x[2]}"><input class="min locked" readonly value="${x[3]}"><input class="score" type="number" disabled value="${r?r[7]:''}"></div>`}).join('');$('edit').classList.remove('hide');$('update').classList.add('hide');$('upload').classList.add('hide');msg('resultMsg','Existing result loaded.','ok')}async function updateResults(){try{const r=await api('adminResultBulk',{studentId:$('rsid').value.trim(),name:$('rname').value.trim(),courseId:$('rcid').value.trim(),course:$('rcourse').value.trim(),results:collect()});msg('resultMsg',r.ok?'✓ '+r.message:r.message,r.ok?'ok':'err');if(r.ok){await loadData();$('update').classList.add('hide');$('edit').classList.remove('hide')}}catch(e){msg('resultMsg',e.message,'err')}}function certificateForm(){$('view').innerHTML='<h3>Certificate</h3><div class="grid"><input id="csid" placeholder="Student ID"><input id="ccid" value="1111" placeholder="Course ID"></div><br><button id="genCert">GENERATE CERTIFICATE</button> <button id="printCert" class="secondary hide">PRINT CERTIFICATE</button><div id="certMsg"></div><div id="certificateBox"></div>';$('genCert').onclick=generateCertificate;$('printCert').onclick=()=>window.print()}function gradeFromPercentage(p){if(p>=90)return'A+';if(p>=80)return'A';if(p>=70)return'B+';if(p>=60)return'B';if(p>=50)return'C+';if(p>=40)return'C';return'F'}function certificateRows(sid,cid){return(data.results||[]).slice(1).filter(r=>String(r[1]).trim().toUpperCase()===sid&&String(r[3]).trim()===cid)}async function generateCertificate(){const sid=$('csid').value.trim().toUpperCase(),cid=$('ccid').value.trim(),rows=certificateRows(sid,cid);if(!sid||!cid)return msg('certMsg','Student ID and Course ID are required.','err');if(!rows.length)return msg('certMsg','No marks found in Results. Upload marks first.','err');const obtained=rows.reduce((a,r)=>a+Number(r[7]||0),0),total=rows.reduce((a,r)=>a+Number(r[8]||0),0),percentage=total?Math.round(obtained/total*10000)/100:0,grade=gradeFromPercentage(percentage),name=String(rows[0][2]||''),course=String(rows[0][4]||'ADCA');try{const r=await api('adminCertificate',{studentId:sid,name,courseId:cid,course,grade});if(!r.ok)return msg('certMsg',r.message,'err');await loadData();const certNo=r.certificateNo;const verifyUrl=API+'?action=verifyCertificate&certificateNo='+encodeURIComponent(certNo);renderCertificate({certificateNo:certNo,verificationUrl:verifyUrl,studentId:sid,name,courseId:cid,course,grade,rows,obtained,total,percentage});$('printCert').classList.remove('hide');msg('certMsg','✓ Certificate generated with QR verification.','ok')}catch(e){msg('certMsg',e.message,'err')}}function renderCertificate(c){const rows=c.rows||[],obtained=c.obtained??rows.reduce((a,r)=>a+Number(r[7]||0),0),total=c.total??rows.reduce((a,r)=>a+Number(r[8]||0),0),percentage=c.percentage??(total?Math.round(obtained/total*10000)/100:0),grade=c.grade||gradeFromPercentage(percentage);$('certificateBox').innerHTML=`<div class="certificate-preview"><div class="cert-head">BABA NANAK ACADEMY</div><div class="cert-title">CERTIFICATE<br><span>OF COMPLETION</span></div><p>This is to certify that</p><div class="cert-name">${esc(c.name)}</div><p>Student ID: <b>${esc(c.studentId)}</b></p><p>has successfully completed <b>${esc(c.course)}</b></p><p>Course ID: <b>${esc(c.courseId)}</b> &nbsp; Grade: <b>${esc(grade)}</b></p><h4>SUBJECT MARKS</h4><table class="cert-marks"><tr><th>Subject</th><th>Marks</th><th>Total</th><th>%</th><th>Result</th></tr>${rows.map(r=>`<tr><td>${esc(r[6])}</td><td>${esc(r[7])}</td><td>${esc(r[8])}</td><td>${esc(r[9])}%</td><td>${esc(r[10])}</td></tr>`).join('')}</table><div class="cert-total">Total: ${obtained} / ${total} &nbsp; | &nbsp; Percentage: ${percentage}% &nbsp; | &nbsp; Grade: ${esc(grade)}</div><div class="cert-no">Certificate No: <b>${esc(c.certificateNo)}</b></div><div class="qr-wrap"><img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(c.verificationUrl)}" alt="Certificate QR"><div class="qr-label">SCAN TO VERIFY CERTIFICATE</div></div></div>`}</script></body></html>
