<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baba Nanak Academy Admin</title><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#18243a}header{background:#061b3b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}input,select,textarea,button{padding:10px;border:1px solid #ccd6e3;border-radius:8px;margin:4px}button{background:#092a5b;color:#fff;border:0;cursor:pointer}.tabs{display:flex;flex-wrap:wrap;gap:5px}.tabs button{background:#1671c9}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:7px;white-space:nowrap}th{background:#eef5ff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>ADMIN PANEL</span></header><main class='wrap'><div id='login' class='card'><h2>Admin Login</h2><input id='pass' type='password' placeholder='Admin password'><button onclick='login()'>Login</button><p id='msg'></p></div><div id='app' class='hide'><div class='card'><h2>Admin Dashboard</h2><p id='stats'></p><button onclick='loadData()'>Refresh Online Data</button><button onclick='logout()'>Logout</button></div><div class='card tabs'><button onclick="tab('courses')">➕ Course + Fee</button><button onclick="tab('students')">👨‍🎓 Students</button><button onclick="tab('fees')">💳 Fee Verify</button><button onclick="tab('results')">📝 Result / Subject Marks</button><button onclick="table('enrollments')">📚 Enrollments</button><button onclick="table('payments')">💰 Payments</button><button onclick="table('certificates')">🏆 Certificates</button></div><div id='view' class='card'></div></div></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let pw='',data={};async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:Object.assign({password:pw},extra)})});return r.json()}async function login(){pw=document.getElementById('pass').value;const r=await api('adminLogin');if(!r.ok){msg.textContent=r.message;return}document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');await loadData();tab('courses')}async function loadData(){const r=await api('adminData');if(!r.ok){alert(r.message);return}data=r;stats.textContent='Students: '+(r.students.length-1)+' | Courses: '+(r.courses.length-1)+' | Enrollments: '+(r.enrollments.length-1)+' | Payments: '+(r.payments.length-1)+' | Results: '+(r.results.length-1)+' | Certificates: '+(r.certificates.length-1)}function tab(k){if(k==='courses')return courseForm();if(k==='students')return studentForm();if(k==='fees')return feeForm();if(k==='results')return resultForm();table(k)}function table(k){const rows=data[k]||[];view.innerHTML='<h3>'+k+'</h3><div class="table"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+String(c??'')+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}function courseForm(){view.innerHTML=`<h3>Add Course / Set Fee</h3><div class='grid'><input id='cn' placeholder='Course name'><input id='cf' type='number' placeholder='Fee ₹'><textarea id='cs' placeholder='Subjects, comma separated'></textarea></div><button onclick='addCourse()'>Add Course</button><p id='fm'></p><hr><button onclick="table('courses')">View All Courses</button>`}async function addCourse(){const r=await api('adminCourseAdd',{course:cn.value,fee:cf.value,subjects:cs.value});fm.textContent=r.message;if(r.ok){await loadData();courseForm()}}function studentForm(){view.innerHTML=`<h3>Manual Student Add</h3><div class='grid'><input id='sn' placeholder='Full Name'><input id='se' placeholder='Email'><input id='sp' placeholder='Mobile'><input id='sd' type='date'><textarea id='sa' placeholder='Address'></textarea></div><button onclick='addStudent()'>Add Student</button><p id='sm'></p><hr><button onclick="table('students')">View Online + Manual Students</button>`}async function addStudent(){const r=await api('adminStudentAdd',{name:sn.value,email:se.value,phone:sp.value,dob:sd.value,address:sa.value});sm.textContent=r.ok?'Student added: '+r.studentId:r.message;if(r.ok)await loadData()}function feeForm(){view.innerHTML=`<h3>Fee / Payment Verification</h3><div class='grid'><input id='fi' placeholder='Payment ID'><input id='fo' placeholder='Order ID'><input id='fs' placeholder='Student ID'><input id='fc' placeholder='Course ID'><input id='fn' placeholder='Course name'><input id='fa' type='number' placeholder='Amount'></div><button onclick='verifyFee()'>Verify / Mark Paid</button><p id='fm2'></p><hr><button onclick="table('payments')">View All Online Payments</button>`}async function verifyFee(){const r=await api('adminPaymentVerify',{paymentId:fi.value,orderId:fo.value,studentId:fs.value,courseId:fc.value,course:fn.value,amount:fa.value});fm2.textContent=r.message;if(r.ok)await loadData()}function resultForm(){view.innerHTML=`<h3>Result Upload — All Subjects / Marks</h3><div class='grid'><input id='rsid' placeholder='Student ID'><input id='rname' placeholder='Student Name'><input id='rcid' placeholder='Course ID'><input id='rcourse' placeholder='Course'><input id='rtotal' type='number' placeholder='Total Marks' value='100'><input id='rexam' placeholder='Exam ID'></div><p>Enter one subject per row:</p><div id='subs'><div><input class='sub' placeholder='Subject'><input class='score' type='number' placeholder='Marks'></div></div><button onclick='addSubject()'>+ Add Subject</button><button onclick='uploadResults()'>Upload All Marks</button><p id='rm'></p><hr><button onclick="table('results')">View Results</button>`}function addSubject(){subs.insertAdjacentHTML('beforeend',`<div><input class='sub' placeholder='Subject'><input class='score' type='number' placeholder='Marks'></div>`)}async function uploadResults(){const subjects=[...document.querySelectorAll('.sub')],scores=[...document.querySelectorAll('.score')],results=subjects.map((x,i)=>({subject:x.value,score:scores[i].value,total:rtotal.value})).filter(x=>x.subject);const r=await api('adminResultBulk',{studentId:rsid.value,name:rname.value,courseId:rcid.value,course:rcourse.value,examId:rexam.value,results});rm.textContent=r.message;if(r.ok)await loadData()}function logout(){location.reload()}</script></body></html>
