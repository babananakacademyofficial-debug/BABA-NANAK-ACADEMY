<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration — Baba Nanak Academy</title><style>:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef;--ok:#176b4b;--bad:#a12d4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}.wrap{width:min(760px,92%);margin:35px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px #082b5d10}.brand{font-weight:900;color:var(--n);font-size:24px}.muted{color:#66758c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:8px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.field textarea{min-height:100px;resize:vertical}.subjects{border:1px solid #ccd8e5;border-radius:10px;padding:12px;background:#f9fbff}.sub{display:flex;gap:9px;align-items:flex-start;padding:11px;border-bottom:1px solid #e5ebf2;cursor:pointer}.sub:last-child{border-bottom:0}.sub input{margin-top:3px;width:18px;height:18px}.selectall{display:flex;align-items:center;gap:9px;padding:10px;margin-bottom:8px;border-radius:9px;background:#eaf3ff;font-weight:900;color:var(--n)}.selectall input{width:18px;height:18px}.btn{padding:13px 18px;border:0;border-radius:10px;background:var(--n);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.blue{background:var(--b)}.green{background:var(--ok)}.hide{display:none!important}.msg{padding:13px;border-radius:10px;margin-top:15px}.ok{background:#e9f8f2;color:var(--ok)}.err{background:#fff0f3;color:var(--bad)}.links{margin-top:18px}.links a{color:var(--b);font-weight:800;text-decoration:none;margin-right:15px}.step{padding:12px;border-radius:10px;background:#eef5ff;color:var(--n);font-weight:900;margin:14px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><div class="brand">BABA NANAK ACADEMY ONLINE</div><h1>Student Registration</h1><div class="step" id="step1">STEP 1 — REGISTER STUDENT</div><form id="form"><div class="grid"><div class="field"><label>Full Name *</label><input id="name" required autocomplete="name"></div><div class="field"><label>Email *</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Mobile *</label><input id="phone" inputmode="numeric" maxlength="10" required autocomplete="tel"></div><div class="field"><label>Date of Birth</label><input id="dob" type="date"></div></div><div class="field"><label>Course *</label><select id="course" required><option value="">Select Course</option><option value="1111">1111 — ADCA</option></select></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><button class="btn" id="registerBtn">REGISTER STUDENT →</button></form><section id="subjectStep" class="hide"><div class="step">STEP 2 — SELECT SUBJECTS</div><p class="muted">Student registered successfully. Tick the subjects you want to enroll in, then press the final submit button.</p><div class="subjects" id="subjects"></div><button type="button" class="btn green" id="finalEnrollBtn" disabled>SUBMIT FINAL — ENROLL SELECTED SUBJECTS</button></section><div id="msg"></div><div class="links"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="online.html">Online Student</a></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const ADCA=[['1111-01','Computer Fundamental',100],['1111-02','Desktop Publishing',100],['1111-03','HTML, C++',100],['1111-04','Tally ERP 9.0',100],['1111-05','Typing English/Punjabi',100],['1111-06','Installation Windows, Windows Ghost, Hardware',100],['1111-07','Practical Lab Assignment & Viva-Voce',400]];const $=id=>document.getElementById(id);let registeredStudentId='',registeredCourseId='';function show(t,c=''){const e=$('msg');e.className=c?'msg '+c:'msg';e.textContent=t}function renderSubjects(){const id=registeredCourseId;if(id!=='1111'){$('subjects').innerHTML='<div class="muted">No subjects available.</div>';return}$('subjects').innerHTML='<label class="selectall"><input type="checkbox" id="selectAll"> ☑ SELECT ALL SUBJECTS</label>'+ADCA.map(x=>'<label class="sub"><input type="checkbox" name="subject" value="'+x[0]+'"> <span><b>'+x[0]+'</b> — '+x[1]+' <small>(Max '+x[2]+')</small></span></label>').join('');$('selectAll').onchange=()=>{document.querySelectorAll('input[name="subject"]').forEach(x=>x.checked=$('selectAll').checked);updateFinal()};document.querySelectorAll('input[name="subject"]').forEach(x=>x.onchange=updateFinal)}function updateFinal(){$('finalEnrollBtn').disabled=!document.querySelectorAll('input[name="subject"]:checked').length}async function registerStudent(){const phone=$('phone').value.replace(/\D/g,'');if(!/^[6-9][0-9]{9}$/.test(phone)){show('Enter a valid 10-digit mobile number.','err');return}const payload={name:$('name').value.trim(),email:$('email').value.trim(),phone,dob:$('dob').value,address:$('address').value.trim(),courseId:$('course').value};$('registerBtn').disabled=true;$('registerBtn').textContent='REGISTERING…';show('Registering student…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',data:payload})});const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('Invalid server response.')}if(!d.ok)throw Error(d.message||'Registration failed.');registeredStudentId=d.studentId;registeredCourseId=$('course').value;show('Registration successful. Student ID: '+d.studentId+'. Now select subjects below.','ok');$('form').classList.add('hide');$('step1').classList.add('hide');$('subjectStep').classList.remove('hide');renderSubjects();window.scrollTo({top:0,behavior:'smooth'})}catch(e){show(e.message,'err');$('registerBtn').disabled=false;$('registerBtn').textContent='REGISTER STUDENT →'}}$('form').onsubmit=e=>{e.preventDefault();registerStudent()};$('finalEnrollBtn').onclick=async()=>{const subjects=[...document.querySelectorAll('input[name="subject"]:checked')].map(x=>x.value);if(!subjects.length){show('Please tick at least one subject.','err');return}$('finalEnrollBtn').disabled=true;$('finalEnrollBtn').textContent='ENROLLING SELECTED SUBJECTS…';show('Submitting final subject enrollment…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'enrollment',data:{studentId:registeredStudentId,courseId:registeredCourseId,subjectIds:subjects,subjects:subjects.join(',')}})});const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('Invalid server response.')}if(!d.ok)throw Error(d.message||'Subject enrollment failed.');show('✓ Final enrollment complete. Student ID: '+registeredStudentId+' • Subjects enrolled: '+subjects.length+'.','ok');$('subjectStep').innerHTML='<div class="step">✓ STEP 2 COMPLETE — ENROLLMENT DONE</div><p><b>Student ID:</b> '+registeredStudentId+'</p><p><b>Subjects enrolled:</b> '+subjects.length+'</p><p class="muted">You can now login to the Online Student System.</p><a class="btn blue" href="online.html">GO TO ONLINE STUDENT LOGIN →</a>'}catch(e){show(e.message,'err');$('finalEnrollBtn').disabled=false;$('finalEnrollBtn').textContent='SUBMIT FINAL — ENROLL SELECTED SUBJECTS'}};</script></body></html>
