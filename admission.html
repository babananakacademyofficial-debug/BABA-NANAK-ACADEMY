<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Student Registration - Baba Nanak Academy</title><style>body{font-family:Arial;background:#f5f8fc;margin:0}.box{max-width:600px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001}input,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd6e3;border-radius:9px;box-sizing:border-box}button{background:#092a5b;color:#fff;border:0;cursor:pointer}.ok{background:#e9fff0;padding:15px;border-radius:10px}.err{background:#fff0f0;padding:15px;border-radius:10px}</style></head><body><div class='box'><h1>Baba Nanak Academy</h1><h2>Student Registration</h2><form onsubmit='register(event)'><input id='name' placeholder='Full Name' required><input id='email' type='email' placeholder='Email' required><input id='phone' placeholder='10-digit Mobile Number' maxlength='10' required><input id='dob' type='date'><textarea id='address' placeholder='Address'></textarea><button>Register Student</button></form><div id='msg'></div></div><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';async function register(e){e.preventDefault();const m=document.getElementById('msg');m.textContent='Registering...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',data:{name:name.value,email:email.value,phone:phone.value,dob:dob.value,address:address.value}})});const x=await r.json();if(!x.ok){m.className='err';m.textContent=x.message;return}m.className='ok';m.innerHTML='Registration successful!<br><b>Student ID: '+x.studentId+'</b><br>Save this ID. <a href="portal.html">Open Student Login</a>';e.target.reset()}catch(err){m.className='err';m.textContent='Connection error: '+err.message}}</script></body></html>
