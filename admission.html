<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration — Baba Nanak Academy</title><style>:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}.wrap{width:min(760px,92%);margin:35px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px #082b5d10}.brand{font-weight:900;color:var(--n);font-size:24px}.muted{color:#66758c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:8px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{padding:13px 18px;border:0;border-radius:10px;background:var(--n);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.msg{padding:13px;border-radius:10px;margin-top:15px}.ok{background:#e9f8f2;color:#176b4b}.err{background:#fff0f3;color:#a12d4d}.links{margin-top:18px}.links a{color:var(--b);font-weight:800;text-decoration:none;margin-right:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><div class="brand">BABA NANAK ACADEMY ONLINE</div><h1>Student Registration</h1><p class="muted">Register once and receive your unique Student ID.</p><form id="form"><div class="grid"><div class="field"><label>Full Name *</label><input id="name" required autocomplete="name"></div><div class="field"><label>Email *</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Mobile *</label><input id="phone" inputmode="numeric" maxlength="10" required autocomplete="tel"></div><div class="field"><label>Date of Birth</label><input id="dob" type="date"></div></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><button class="btn" id="btn">Register Student →</button></form><div id="msg"></div><div class="links"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="portal.html">Student Portal</a></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();const phone=$('phone').value.replace(/\D/g,'');if(!/^[6-9][0-9]{9}$/.test(phone)){show('Enter a valid 10-digit mobile number.','err');return}$('btn').disabled=true;$('btn').textContent='Registering…';show('Please wait…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',data:{name:$('name').value.trim(),email:$('email').value.trim(),phone:phone,dob:$('dob').value,address:$('address').value.trim()}})});const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('Invalid server response.')}if(!d.ok)throw Error(d.message||'Registration failed.');show('Registration successful. Student ID: '+d.studentId,'ok');$('form').reset();}catch(e){show(e.message,'err')}finally{$('btn').disabled=false;$('btn').textContent='Register Student →'}};function show(t,c=''){const e=$('msg');e.className=c?'msg '+c:'msg';e.textContent=t}</script></body></html>
