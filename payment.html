<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Course Payment | Baba Nanak Academy</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f9ff;color:#14233b}.wrap{max-width:760px;margin:40px auto;padding:0 18px}.brand{text-align:center;color:#092a5b;font-size:25px;font-weight:900}.sub{text-align:center;color:#1671c9;font-weight:800;margin:6px 0 24px}.card{background:#fff;border:1px solid #d8e3ef;border-radius:20px;padding:28px;box-shadow:0 15px 45px #092a5b12;margin-bottom:18px}h1{color:#092a5b}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #e5edf5}.label{color:#66768d}.value{font-weight:800;text-align:right}.amount{font-size:28px;color:#092a5b}.notice{background:#eef7ff;border:1px solid #cfe4f6;padding:14px;border-radius:12px;color:#38516f;margin-top:18px}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd9e7;border-radius:10px;font-size:15px}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;background:#092a5b;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.6;cursor:not-allowed}.back{display:inline-block;margin-top:15px;color:#1671c9;font-weight:800}.msg{padding:12px;border-radius:10px;margin-top:15px}.ok{background:#e9f8f2;color:#126b4d}.err{background:#fff0f3;color:#a12d4d}.small{font-size:12px;color:#718198;margin-top:10px}
</style>
</head>
<body>
<div class="wrap"><div class="brand">BABA NANAK ACADEMY ONLINE</div><div class="sub">COURSE ENROLLMENT • SECURE PAYMENT</div>
<section class="card"><h1>Confirm Your Enrollment</h1><div class="row"><span class="label">Student ID</span><span class="value" id="student">—</span></div><div class="row"><span class="label">Course</span><span class="value" id="course">—</span></div><div class="row"><span class="label">Course Fee</span><span class="value amount" id="fee">₹0</span></div>
<div class="field"><label for="email">Registered Email</label><input id="email" type="email" placeholder="Email used during registration" autocomplete="email"></div>
<div class="notice"><b>Secure Razorpay Payment</b><br>UPI • Cards • Net Banking<div class="small">Payment is verified by the Baba Nanak Academy server before enrolment is marked Paid.</div></div>
<button class="btn" id="payBtn" onclick="startPayment()">Proceed to Secure Payment →</button><div id="msg"></div><a class="back" href="courses.html">← Back to Course List</a></section></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';
const p=new URLSearchParams(location.search);const studentId=p.get('studentId')||'';const courseId=p.get('courseId')||'';const courseName=p.get('course')||'Course';const fee=Number(p.get('fee')||0);
document.getElementById('student').textContent=studentId||'—';document.getElementById('course').textContent=courseName||'—';document.getElementById('fee').textContent='₹'+fee.toLocaleString('en-IN');
try{const me=JSON.parse(sessionStorage.getItem('bna_student')||'null');if(me&&me.email)document.getElementById('email').value=me.email}catch(e){}
async function api(action,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});return r.json()}
function show(text,bad){const el=document.getElementById('msg');el.className=bad?'msg err':'msg ok';el.textContent=text}
async function startPayment(){const email=document.getElementById('email').value.trim();const btn=document.getElementById('payBtn');if(!studentId||!courseId)return show('Student or course information is missing.',true);if(!email)return show('Registered email is required.',true);btn.disabled=true;btn.textContent='Creating secure order...';show('Please wait...');try{const verified=await api('verifyStudent',{studentId:studentId,email:email});if(!verified.ok)return show(verified.message||'Student verification failed.',true);const order=await api('createRazorpayOrder',{studentId:studentId,courseId:courseId});if(!order.ok)return show(order.message||'Unable to create payment order.',true);const options={key:order.keyId,amount:order.amount,currency:order.currency||'INR',name:'Baba Nanak Academy',description:(order.course&&order.course.name)||courseName,order_id:order.orderId,prefill:{name:verified.student.name,email:verified.student.email,contact:verified.student.phone||''},theme:{color:'#092a5b'},handler:async function(response){try{show('Verifying payment securely...');const result=await api('verifyRazorpayPayment',{studentId:studentId,courseId:courseId,razorpay_payment_id:response.razorpay_payment_id,razorpay_order_id:response.razorpay_order_id,razorpay_signature:response.razorpay_signature});if(!result.ok)return show(result.message||'Payment verification failed.',true);show('Payment successful. Course enrollment is confirmed.');btn.textContent='Payment Completed ✓';setTimeout(function(){location.href='portal.html'},1800)}catch(e){show('Payment verification error: '+e.message,true)}},modal:{ondismiss:function(){btn.disabled=false;btn.textContent='Proceed to Secure Payment →';show('Payment window closed. No payment was confirmed.',true)}}};const rzp=new Razorpay(options);rzp.on('payment.failed',function(response){show('Payment failed: '+((response.error&&response.error.description)||'Please try again.'),true);btn.disabled=false;btn.textContent='Try Payment Again →'});rzp.open()}catch(e){show('Connection error: '+e.message,true)}finally{if(btn.textContent==='Creating secure order...'){btn.disabled=false;btn.textContent='Proceed to Secure Payment →'}}}
</script>
</body></html>
