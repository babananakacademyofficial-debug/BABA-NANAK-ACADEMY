<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Payment | Baba Nanak Academy</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f9ff;color:#14233b}.wrap{max-width:760px;margin:40px auto;padding:0 18px}.brand{text-align:center;color:#092a5b;font-size:24px;font-weight:900}.sub{text-align:center;color:#1671c9;font-weight:800;margin:6px 0 24px}.card{background:#fff;border:1px solid #d8e3ef;border-radius:20px;padding:28px;box-shadow:0 15px 45px #092a5b12;margin-bottom:18px}h1,h2{color:#092a5b}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #e5edf5}.row:last-child{border-bottom:0}.label{color:#66768d}.value{font-weight:800;text-align:right}.amount{font-size:28px;color:#092a5b}.notice{background:#eef7ff;border:1px solid #cfe4f6;padding:14px;border-radius:12px;color:#38516f}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#092a5b;color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin-top:18px}.back{display:inline-block;margin-top:15px;color:#1671c9;font-weight:800}.small{font-size:12px;color:#718198;margin-top:12px}</style></head><body><div class="wrap"><div class="brand">BABA NANAK ACADEMY ONLINE</div><div class="sub">COURSE ENROLLMENT • PAYMENT</div><section class="card"><h1>Confirm Your Enrollment</h1><div class="row"><span class="label">Student ID</span><span class="value" id="student">—</span></div><div class="row"><span class="label">Course</span><span class="value" id="course">—</span></div><div class="row"><span class="label">Course Fee</span><span class="value amount" id="fee">Contact Academy</span></div><div class="notice"><b>Payment Gateway</b><br>UPI • Card • Net Banking<br><span class="small">Gateway credentials must be connected before real payments are accepted.</span></div><button class="btn" onclick="alert('Payment gateway is not connected yet. No money has been charged.')">Proceed to Secure Payment →</button><a class="back" href="courses.html">← Back to Course List</a></section></div><script>const p=new URLSearchParams(location.search);document.getElementById('student').textContent=p.get('studentId')||'—';document.getElementById('course').textContent=p.get('course')||'—';document.getElementById('fee').textContent=p.get('fee')||'Contact Academy';</script></body></html>
