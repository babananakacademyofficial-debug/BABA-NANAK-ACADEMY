<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Access | Baba Nanak Academy</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17263d}.wrap{max-width:1050px;margin:auto;padding:25px 18px}.card{background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:25px;box-shadow:0 15px 45px #082b5c14}.gate{text-align:center;max-width:620px;margin:70px auto}.gate h1{color:#082b5c}.gate p{color:#65758c}.field{display:grid;gap:7px;text-align:left;margin:14px 0}label{font-weight:800;font-size:13px}input{padding:13px;border:1px solid #ccd9e7;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:13px 20px;background:#082b5c;color:#fff;font-weight:900;cursor:pointer}.error{color:#a12d4d;background:#fff0f3;padding:10px;border-radius:8px;margin-top:12px}.hidden{display:none}.top{background:#082b5c;color:#fff}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand small{display:block;font-size:10px;color:#cfe2f8}.course-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.course{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:16px;cursor:pointer}.course.selected{border:2px solid #1674cf;background:#eef7ff}.course b{display:block;color:#082b5c;margin:6px 0}.course small{color:#68788d}.subjects{margin-top:20px;padding:18px;background:#eef7ff;border-radius:14px}.subject{display:inline-block;background:#fff;padding:9px;margin:5px;border-radius:8px;font-weight:700;font-size:12px}.toolbar{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.msg{margin-top:15px;padding:12px;border-radius:8px}.ok{background:#e9f8f2;color:#126b4d}.err{background:#fff0f3;color:#a12d4d}@media(max-width:700px){.course-list{grid-template-columns:1fr}.top .wrap{display:block}.top{padding:12px 0}}</style></head><body><header class="top"><div class="wrap"><div class="brand">BABA NANAK ACADEMY<small>ONLINE LEARNING PORTAL</small></div><a href="index.html" style="color:#fff">Home</a></div></header><main class="wrap"><section id="gate" class="card gate"><h1>🔐 Student Verification Required</h1><p>Course selection is available only to registered students.</p><div class="field"><label>Student ID *</label><input id="sid" placeholder="Enter your Student ID" required></div><div class="field"><label>Registered Email *</label><input id="semail" type="email" placeholder="Enter your registered email" required></div><button class="btn" onclick="verifyStudent()">Verify & Continue →</button><div id="gateMsg"></div></section><section id="catalog" class="hidden"><div class="card"><h1>Choose Your Course</h1><p>Select a course. Subjects will appear automatically.</p><div class="toolbar"><input id="search" placeholder="Search course or category..."></div><div id="list" class="course-list"></div><div id="subjects" class="subjects hidden"><h2 id="title"></h2><div id="sublist"></div><button class="btn" id="save" onclick="saveCourse()">Save Course Selection →</button></div><div id="msg"></div></div></section></main><script>const API_URL='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let courses=[],selected=null,student={};const subjects=c=>['Course Fundamentals','Core Concepts','Practical Skills','Assignments','Final Project'];async function verifyStudent(){const id=document.getElementById('sid').value.trim(),email=document.getElementById('semail').value.trim();if(!id||!email)return showGate('Student ID and registered email are required.');showGate('Verifying...');try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'verifyStudent',public:true,data:{studentId:id,email}})});const j=await r.json();if(!j.ok)throw Error(j.message||'Student not found');student={studentId:id,email};courses=await fetch('courses.json').then(r=>r.json());document.getElementById('gate').classList.add('hidden');document.getElementById('catalog').classList.remove('hidden');render()}catch(e){showGate(e.message||'Verification failed. Register first.')}}function showGate(t){document.getElementById('gateMsg').className='error';document.getElementById('gateMsg').textContent=t}function render(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('list').innerHTML=courses.filter(c=>c.name.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)).map(c=>`<article class="course ${selected&&selected.id===c.id?'selected':''}" onclick="choose('${c.id}')"><small>COURSE ${String(c.id).padStart(2,'0')} • ${c.category}</small><b>${c.name}</b></article>`).join('')}function choose(id){selected=courses.find(c=>String(c.id)===String(id));document.getElementById('title').textContent=selected.name+' — Subjects';document.getElementById('sublist').innerHTML=subjects(selected).map(s=>`<span class="subject">${s}</span>`).join('');document.getElementById('subjects').classList.remove('hidden');render()}async function saveCourse(){if(!selected)return;const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Saving...';try{const data={studentId:student.studentId,email:student.email,courseId:String(selected.id),course:selected.name,subjects:subjects(selected).join(', ')};const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'enrollment',public:true,data})});const j=await r.json();if(!j.ok)throw Error(j.message);document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent='Course saved. Next step: Payment.'}catch(e){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent=e.message||'Unable to save course.'}finally{btn.disabled=false;btn.textContent='Save Course Selection →'}}document.getElementById('search').oninput=render;</script></body></html>
