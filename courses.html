<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course List | Baba Nanak Academy</title>
<style>
:root{--navy:#092a5b;--blue:#1671c9;--gold:#f4b63f;--bg:#f5f8fc;--line:#dbe5f0;--muted:#65758c;--green:#208a62}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#14233b}.top{background:var(--navy);color:#fff;padding:18px 0}.wrap{width:min(1120px,92%);margin:auto}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:#cfe3f7;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;margin:22px 0;box-shadow:0 12px 40px rgba(10,43,88,.08)}h1,h2{color:var(--navy)}h1{margin:0 0 6px}.intro{color:var(--muted);margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#40516d}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit}.count{margin:18px 0 8px;color:var(--blue);font-weight:900;font-size:13px}.categories{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}.cat.active,.cat:hover{background:var(--navy);color:#fff;border-color:var(--navy)}.course-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.course{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;cursor:pointer;transition:.15s}.course:hover,.course.selected{border-color:var(--blue);background:#f1f8ff;transform:translateY(-1px)}.course b{display:block;color:var(--navy);font-size:14px}.course small{display:block;color:var(--muted);margin-top:5px}.subjects{display:none;margin-top:20px;padding:20px;border:1px solid #cfe0ef;background:#f7faff;border-radius:16px}.subjects.show{display:block}.subjects h2{font-size:20px;margin:0 0 10px}.subjects ul{margin:0;padding-left:20px;color:#4f6380}.actions{display:flex;justify-content:flex-end;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 22px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{display:none;margin-top:15px;padding:13px;border-radius:10px;font-weight:700}.msg.show{display:block}.success{background:#eaf8f2;color:#176b4b}.error{background:#fff0f3;color:#a12d4d}.back{display:inline-block;color:var(--blue);font-weight:800;margin-top:15px}@media(max-width:700px){.grid,.course-list{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">BABA NANAK ACADEMY</div><div class="sub">COURSE CATALOGUE • 53 COURSES</div></div></header>
<main class="wrap">
<section class="card"><h1>Choose Your Course</h1><p class="intro">Select a course below. After you choose it, the subjects for that course will appear automatically.</p>
<form id="courseForm"><div class="grid"><div class="field"><label>Registered Student ID *</label><input id="studentId" required placeholder="Enter Student ID"></div><div class="field"><label>Registered Email *</label><input id="email" type="email" required placeholder="Enter registered email"></div><div class="field full"><label>Search Courses</label><input id="search" placeholder="Search by course name or category..."></div></div>
<div id="categories" class="categories"></div><div id="count" class="count"></div><div id="courseList" class="course-list"></div>
<div id="subjects" class="subjects"><h2 id="subjectTitle"></h2><ul id="subjectList"></ul></div>
<div class="actions"><button id="submit" class="btn" disabled>Save Course Selection</button></div><div id="msg" class="msg"></div></form><a class="back" href="index.html">← Back to Academy Home</a></section>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';
const modules={
'Computer Fundamentals':['Computer Basics','Operating Systems','Files & Folders','Keyboard & Mouse','Internet Basics'],'Basic Computer & Internet':['Computer Basics','Windows','Internet','Email','Online Safety'],'MS Office':['MS Word','MS Excel','MS PowerPoint','Office Productivity','Practical Projects'],'MS Word':['Word Interface','Formatting','Tables','Mail Merge','Practical Documents'],'MS Excel':['Worksheets','Formulas','Functions','Charts','Practical Reports'],'MS PowerPoint':['Slides','Themes','Animations','Presentations','Practical Project'],'Internet & Email':['Web Browsing','Search','Email','Attachments','Online Safety'],'Typing — English':['Keyboard Practice','Typing Accuracy','Typing Speed','Documents','Typing Test'],'Typing — Punjabi':['Punjabi Keyboard','Typing Practice','Accuracy','Documents','Typing Test'],'Digital Literacy':['Digital Devices','Internet Safety','Online Services','Digital Payments','Practical Skills'],'Advanced Excel':['Advanced Formulas','Pivot Tables','Charts','Data Tools','Dashboards'],'Tally Prime':['Company Setup','Ledgers','Vouchers','Reports','Practical Accounting'],'Tally + GST':['Tally Prime','GST Setup','GST Transactions','Returns','Reports'],'Computerized Accounting':['Accounting Basics','Ledger','Vouchers','Tally','Practical Accounts'],'Data Entry Operator':['Data Entry','Typing','Excel','Accuracy','Practical Work'],'Office Assistant':['Office Skills','MS Office','Email','Documentation','Practical Work'],'Computer Operator':['Computer Operations','MS Office','Internet','File Management','Practical Work'],'DTP — Desktop Publishing':['Page Layout','Typography','DTP Tools','Print Design','Project'],'Photoshop':['Tools','Layers','Retouching','Photo Editing','Design Project'],'CorelDRAW':['Vector Design','Shapes','Typography','Layouts','Design Project'],'Canva & Graphic Designing':['Canva Tools','Layouts','Branding','Social Designs','Design Project'],'Web Designing':['HTML','CSS','Responsive Design','UI Basics','Web Project'],'HTML & CSS':['HTML5','CSS3','Layouts','Responsive Design','Website Project'],'JavaScript':['Syntax','DOM','Events','Functions','Projects'],'WordPress':['Setup','Themes','Plugins','Pages & Posts','Website Project'],'Full Stack Web Development':['HTML/CSS','JavaScript','Backend','Database','Full Stack Project'],'Python Programming':['Python Basics','Data Types','Functions','OOP','Projects'],'C Programming':['Syntax','Variables','Functions','Arrays','Projects'],'C++ Programming':['C++ Basics','OOP','STL','Functions','Projects'],'Java Programming':['Java Basics','OOP','Collections','Exceptions','Projects'],'Database / MySQL':['SQL Basics','Tables','Queries','Joins','Database Project'],'Graphic Designing':['Design Principles','Typography','Color','Branding','Design Project'],'Video Editing':['Editing Basics','Timeline','Transitions','Audio','Video Project'],'Digital Marketing':['SEO','Content','Social Media','Analytics','Campaign Project'],'Social Media Marketing':['Platforms','Content Strategy','Ads','Analytics','Campaign Project'],'UI/UX Designing':['UX Research','Wireframes','UI Design','Prototyping','Portfolio Project'],'Animation Basics':['Animation Principles','Keyframes','Motion','Graphics','Animation Project'],'Cyber Security Basics':['Security Fundamentals','Threats','Passwords','Network Safety','Security Practices'],'Networking Basics':['Networks','IP Addressing','Protocols','LAN/WAN','Troubleshooting'],'Computer Hardware & Networking':['Hardware','Assembly','Networking','Troubleshooting','Practical Lab'],'Cloud Computing Basics':['Cloud Concepts','Services','Storage','Security','Cloud Project'],'AI Tools & Generative AI':['AI Fundamentals','Prompting','Generative Tools','Productivity','AI Project'],'AI for Office Work':['AI Productivity','Documents','Spreadsheets','Presentations','Automation'],'Data Analytics Basics':['Data Basics','Excel Analytics','Visualization','KPIs','Analytics Project'],'Office Management':['Office Administration','Communication','Records','MS Office','Practical Work'],'MIS Executive':['MIS Concepts','Excel','Reports','Dashboards','MIS Project'],'Back Office Executive':['Office Operations','Data Management','Excel','Communication','Practical Work'],'Digital Marketing Executive':['SEO','Content','Social Media','Analytics','Campaign Project'],'Web Developer':['HTML/CSS','JavaScript','Web Tools','Database','Web Project'],'Graphic Designer':['Design Principles','Graphic Tools','Branding','Layouts','Portfolio Project']};
const list=document.getElementById('courseList'),search=document.getElementById('search'),cats=document.getElementById('categories'),count=document.getElementById('count'),submit=document.getElementById('submit'),subjects=document.getElementById('subjects'),title=document.getElementById('subjectTitle'),ul=document.getElementById('subjectList'),msg=document.getElementById('msg');let courses=[],selected=null,category='All';
const subjectsFor=n=>modules[n]||['Course Fundamentals','Core Concepts','Practical Skills','Assignments','Final Project'];
function renderCats(){const cs=['All',...new Set(courses.map(x=>x.category))];cats.innerHTML=cs.map(c=>`<button type="button" class="cat ${category===c?'active':''}">${c}</button>`).join('');[...cats.children].forEach(b=>b.onclick=()=>{category=b.textContent;renderCats();render()})}
function render(){const q=search.value.toLowerCase().trim();const data=courses.filter(c=>(category==='All'||c.category===category)&&(!q||c.name.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)));count.textContent=`Showing ${data.length} of ${courses.length} courses`;list.innerHTML=data.map(c=>`<div class="course ${selected&&selected.id===c.id?'selected':''}" data-id="${c.id}"><b>${c.id}. ${c.name}</b><small>${c.category}</small></div>`).join('');[...list.children].forEach(el=>el.onclick=()=>choose(courses.find(c=>String(c.id)===el.dataset.id)))}
function choose(c){selected=c;title.textContent=`${c.name} — Subjects`;ul.innerHTML=subjectsFor(c.name).map(s=>`<li>${s}</li>`).join('');subjects.classList.add('show');submit.disabled=false;render()}
fetch('courses.json').then(r=>r.json()).then(x=>{courses=x;renderCats();render()}).catch(()=>{msg.className='msg show error';msg.textContent='Course list could not be loaded.'});search.oninput=render;
document.getElementById('courseForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;submit.disabled=true;submit.textContent='Saving...';msg.className='msg';const data={studentId:document.getElementById('studentId').value.trim(),email:document.getElementById('email').value.trim(),courseId:String(selected.id),course:selected.name,subjects:subjectsFor(selected.name).join(', ')};try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'enrollment',public:true,data})});const j=await r.json();if(!j.ok)throw new Error(j.message||'Unable to save selection');msg.className='msg show success';msg.textContent='Course selection saved successfully.'}catch(err){msg.className='msg show error';msg.textContent=err.message||'Unable to save selection.'}finally{submit.disabled=false;submit.textContent='Save Course Selection'}};
</script></body></html>
