<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses & Fees — Baba Nanak Academy</title><style>:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef;--gold:#f4b63f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}header{background:var(--n);color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:800;margin-left:15px}.hero{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:50px 6%}.hero h1,.hero p{max-width:1100px;margin-left:auto;margin-right:auto}.hero h1{font-size:42px;margin-top:0}.wrap{width:min(1100px,92%);margin:25px auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 10px 30px #082b5d0d}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.course{border:1px solid var(--line);border-radius:13px;padding:17px;background:#fff}.course small{color:#68788d}.course h3{color:var(--n);margin:8px 0}.fee{font-weight:900;color:var(--b);font-size:18px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--n);color:#fff;font-weight:900;cursor:pointer}.msg{padding:12px;border-radius:10px;background:#eef5ff}.err{background:#fff0f3;color:#a12d4d}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}nav a{margin-left:8px}}
</style></head><body><header><b>BABA NANAK ACADEMY</b><nav><a href="index.html">Home</a><a href="admission.html">Registration</a><a href="portal.html">Student Login</a><a href="admin.html">Admin</a></nav></header><section class="hero"><h1>Courses & Fees</h1><p>Live course catalogue from the academy system.</p></section><main class="wrap"><section class="card"><div class="toolbar"><input id="search" placeholder="Search by course name or category..."></div><div id="msg" class="msg">Loading courses…</div><div id="grid" class="grid"></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let courses=[];const $=id=>document.getElementById(id);async function load(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'courses',data:{}})});const t=await r.text();const d=JSON.parse(t);if(!d.ok)throw Error(d.message||'Unable to load courses.');courses=Array.isArray(d.courses)?d.courses:[];$('msg').className='msg';$('msg').textContent=courses.length+' courses available';render()}catch(e){$('msg').className='msg err';$('msg').textContent='Unable to load live courses: '+e.message}}function render(){const q=$('search').value.trim().toLowerCase();const list=courses.filter(c=>String(c.name||c.course||'').toLowerCase().includes(q)||String(c.category||'').toLowerCase().includes(q));$('grid').innerHTML=list.map(c=>'<article class="course"><small>Course ID: '+escapeHtml(c.id||c.courseId||'')+'</small><h3>'+escapeHtml(c.name||c.course||'Course')+'</h3><div class="fee">₹'+Number(c.fee||0).toLocaleString('en-IN')+'</div><p><button class="btn" onclick="selectCourse(\''+escapeAttr(c.id||c.courseId||'')+'\')">Select Course</button></p></article>').join('')||'<div class="msg">No matching courses.</div>'}function selectCourse(id){location.href='admission.html?courseId='+encodeURIComponent(id)}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}$('search').oninput=render;load();</script></body></html>
