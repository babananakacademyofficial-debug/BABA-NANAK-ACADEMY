<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification — Baba Nanak Academy</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#17263d}.wrap{max-width:850px;margin:35px auto;padding:20px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0001}.ok{color:#176b4b}.bad{color:#a12d4d}.head{text-align:center;color:#082b5d}.name{text-align:center;font:900 32px Georgia;margin:12px}.meta{text-align:center}.table{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #dbe5ef;padding:9px}th{background:#eef5ff}.center{text-align:center}.badge{display:inline-block;padding:8px 14px;border-radius:20px;background:#e9f8f2;color:#176b4b;font-weight:800}</style></head><body><div class="wrap"><div class="card" id="box"><h1 class="head">BABA NANAK ACADEMY</h1><p class="center">Certificate Verification</p><p class="center">Checking certificate...</p></div></div><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}async function run(){const no=new URLSearchParams(location.search).get('certificateNo')||'';if(!no)return fail('Certificate number missing.');try{const r=await fetch(API+'?action=verifyCertificate&certificateNo='+encodeURIComponent(no)).then(x=>x.json());if(!r.verified)return fail(r.message||'Certificate not found.');$('box').innerHTML='<h1 class="head">BABA NANAK ACADEMY</h1><h2 class="center ok">✓ CERTIFICATE VERIFIED</h2><div class="name">'+esc(r.name)+'</div><p class="meta">Student ID: <b>'+esc(r.studentId)+'</b></p><p class="meta">Course: <b>'+esc(r.course)+'</b> &nbsp; Course ID: <b>'+esc(r.courseId)+'</b></p><p class="center"><span class="badge">Grade: '+esc(r.grade)+'</span></p><div class="table"><table><tr><th>Subject</th><th>Marks</th><th>Total</th><th>%</th><th>Result</th></tr>'+(r.subjects||[]).map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.total)+'</td><td>'+esc(x.percentage)+'%</td><td>'+esc(x.result)+'</td></tr>').join('')+'</table></div><p class="center"><b>Total:</b> '+esc(r.totalObtained)+' / '+esc(r.totalMarks)+' &nbsp; <b>Percentage:</b> '+esc(r.percentage)+'%</p><p class="center">Certificate No: <b>'+esc(r.certificateNo)+'</b></p>'}catch(e){fail('Verification service is temporarily unavailable.')}}function $(id){return document.getElementById(id)}function fail(t){$('box').innerHTML='<h1 class="head">BABA NANAK ACADEMY</h1><h2 class="center bad">✗ CERTIFICATE NOT VERIFIED</h2><p class="center">'+esc(t)+'</p>'}run()</script></body></html>
