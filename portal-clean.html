<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baba Nanak Academy Student Portal</title><script src='https://checkout.razorpay.com/v1/checkout.js'></script><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#122}header{background:#092a5b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #0001}input,button,select{padding:12px;border-radius:9px;border:1px solid #ccd6e3;margin:5px 0}button{background:#092a5b;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.course{border:1px solid #dce5ef;padding:16px;border-radius:12px}.hide{display:none}.msg{padding:10px;border-radius:9px;background:#eef6ff}.danger{background:#fff0f0;color:#a00}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>Student Portal</span></header><main><section id='login' class='card'><h2>Student Login</h2><p>Use the Student ID and the same email used during registration.</p><input id='sid' placeholder='Student ID'><br><input id='email' type='email' placeholder='Registered Email'><br><button onclick='login()'>Login</button><div id='loginMsg'></div></section><section id='dash' class='hide'><div class='card'><h2>Welcome, <span id='name'></span></h2><p>Student ID: <b id='studentId'></b></p><button onclick='logout()'>Logout</button></div><div class='card'><h2>Courses</h2><div id='courses' class='grid'></div></div><div class='card'><h2>My Enrollments</h2><div id='enrollments'></div></div><div class='card'><h2>Results & Certificates</h2><div id='results'></div><div id='certificates'></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let me=null;async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});return r.json()}function msg(t,bad=false){const x=document.getElementById('loginMsg');x.className=bad?'msg danger':'msg';x.textContent=t}async function login(){msg('Checking...');try{const r=await api('verifyStudent',{studentId:document.getElementById('sid').value,email:document.getElementById('email').value});if(!r.ok)return msg(r.message,true);me=r.student;sessionStorage.setItem('bna_student',JSON.stringify(me));show();load()}catch(e){msg('Connection error: '+e.message,true)}}function show(){document.getElementById('login').classList.add('hide');document.getElementById('dash').classList.remove('hide');document.getElementById('name').textContent=me.name;document.getElementById('studentId').textContent=me.studentId}async function load(){const c=await api('courses');document.getElementById('courses').innerHTML=c.courses.map(x=>`<div class='course'><b>${x.name}</b><p>Fee: ₹${x.fee}</p><button onclick='pay(${x.id})'>Pay & Enrol</button></div>`).join('');const d=await api('studentDashboard',me);document.getElementById('enrollments').innerHTML=(d.enrollments||[]).map(x=>`<p><b>${x[3]}</b> — ${x[5]} — Payment: ${x[6]}</p>`).join('')||'No enrolments yet.';document.getElementById('results').innerHTML=(d.results||[]).map(x=>`<p>${x[4]} — ${x[9]} — ${x[8]}%</p>`).join('')||'No results yet.';document.getElementById('certificates').innerHTML=(d.certificates||[]).map(x=>`<p>Certificate: <b>${x[5]}</b> — ${x[4]}</p>`).join('')||'No certificates yet.'}async function pay(id){const r=await api('createRazorpayOrder',{studentId:me.studentId,courseId:id});if(!r.ok)return alert(r.message);const o=new Razorpay({key:r.keyId,amount:r.amount,currency:r.currency,name:'Baba Nanak Academy',description:r.course.name,order_id:r.orderId,prefill:{name:me.name,email:me.email,contact:me.phone},handler:async function(res){const v=await api('verifyRazorpayPayment',Object.assign({studentId:me.studentId,courseId:id},res));alert(v.message);if(v.ok)load()}});o.open()}function logout(){sessionStorage.removeItem('bna_student');location.reload()}(function(){try{me=JSON.parse(sessionStorage.getItem('bna_student'));if(me){show();load()}}catch(e){}}) </script></body></html>
