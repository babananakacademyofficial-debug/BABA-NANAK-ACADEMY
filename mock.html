<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Mock Test</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#17263d}.wrap{width:min(850px,94%);margin:30px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 10px 30px #082b5d10}h1,h2{color:#082b5d}.q{border:1px solid #dbe5ef;border-radius:12px;padding:15px;margin:12px 0}.op{display:block;padding:9px;background:#f6f9fd;margin:7px 0;border-radius:8px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#082b5d;color:#fff;font-weight:900;cursor:pointer}.msg{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#e8f8f0;color:#176b4b}.bad{background:#fff0f3;color:#a12d4d}a{color:#1674cf;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><div class="card"><h1>📝 MOCK TEST</h1><p>Practice test only. Mock result is not the official exam result.</p><form id="f"></form><button class="btn" id="submit">SUBMIT MOCK TEST</button><div id="msg"></div><p><a href="exam.html">Go to Official Exam →</a></p></div></main><script>const Q=[['What is the main input device for typing?',['Monitor','Keyboard','Speaker','Printer'],'Keyboard'],['HTML is mainly used for?',['Web page structure','Accounting','Antivirus','Typing only'],'Web page structure'],['Which software is used for accounting?',['Paint','Tally','Browser','Notepad'],'Tally'],['Which is a safe password practice?',['123456','Your name','Share password','Unique long password'],'Unique long password'],['Which device displays output?',['Keyboard','Mouse','Monitor','Scanner'],'Monitor']];const f=document.getElementById('f');f.innerHTML=Q.map((q,i)=>'<div class="q"><b>Q'+(i+1)+'. '+q[0]+'</b>'+q[1].map(o=>'<label class="op"><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,'&quot;')+'"> '+o+'</label>').join('')+'</div>').join('');document.getElementById('submit').onclick=()=>{let s=0;Q.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&a.value===q[2])s++});const p=s/Q.length*100;const m=document.getElementById('msg');m.className='msg '+(p>=40?'ok':'bad');m.textContent='Mock Score: '+s+'/'+Q.length+' • '+p+'% • '+(p>=40?'PASS':'FAIL')};</script></body></html>
