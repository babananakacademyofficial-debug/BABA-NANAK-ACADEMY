<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Subject Mock Test</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#17263d}.wrap{width:min(900px,94%);margin:30px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 10px 30px #082b5d10}h1,h2{color:#082b5d}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field select{width:100%;padding:12px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.q{border:1px solid #dbe5ef;border-radius:12px;padding:15px;margin:12px 0}.op{display:block;padding:9px;background:#f6f9fd;margin:7px 0;border-radius:8px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#082b5d;color:#fff;font-weight:900;cursor:pointer}.gold{background:#f4b63f;color:#17263d}.msg{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#e8f8f0;color:#176b4b}.bad{background:#fff0f3;color:#a12d4d}.muted{color:#66758c}a{color:#1674cf;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><div class="card"><h1>📝 SUBJECT-WISE MOCK TEST</h1><p class="muted">ADCA Course 1111 • Practice only • Each subject has its own mock test.</p><div class="field"><label>Select Subject</label><select id="subject"></select></div><form id="f"></form><button class="btn gold" id="submit">SUBMIT SUBJECT MOCK TEST</button><div id="msg"></div><p><a href="exam.html">🎓 Go to Subject-wise Official Exam →</a> &nbsp; <a href="online.html">Online Student</a></p></div></main><script>const SUBJECTS=[['1111-01','Computer Fundamental'],['1111-02','Desktop Publishing'],['1111-03','HTML, C++'],['1111-04','Tally ERP 9.0'],['1111-05','Typing English/Punjabi'],['1111-06','Installation Windows, Windows Ghost, Hardware'],['1111-07','Practical Lab Assignment & Viva-Voce']];const BANK={'1111-01':[['CPU stands for?',['Central Processing Unit','Computer Power Unit','Central Print Unit','Control Program Utility'],'Central Processing Unit'],['Which is an input device?',['Keyboard','Monitor','Speaker','Printer'],'Keyboard'],['Which stores data permanently?',['RAM','Hard Disk','Cache','Register'],'Hard Disk'],['Which is an operating system?',['Windows','HTML','Tally','Keyboard'],'Windows'],['1 KB is commonly equal to?',['1024 bytes','100 bytes','10 bytes','2048 bits'],'1024 bytes']], '1111-02':[['DTP stands for?',['Desktop Publishing','Digital Text Program','Data Type Processing','Desktop Typing Process'],'Desktop Publishing'],['Which is used for page layout?',['PageMaker/InDesign','Calculator','Antivirus','Media Player'],'PageMaker/InDesign'],['A font controls?',['Text appearance','Internet speed','Hard disk size','Printer cable'],'Text appearance'],['Which is a graphic element?',['Image','CPU','RAM','Keyboard'],'Image'],['DTP output can be?',['Printed document','Only audio','Only code','Only email'],'Printed document']], '1111-03':[['HTML stands for?',['HyperText Markup Language','HighText Machine Language','Hyperlink Text Management Language','Home Tool Markup Language'],'HyperText Markup Language'],['Which tag creates a paragraph?',['<p>','<img>','<table>','<brx>'],'<p>'],['C++ is mainly a?',['Programming language','Database','Browser','Printer driver'],'Programming language'],['Which symbol ends a C++ statement?',[';','.',':','#'],';'],['Which is a C++ loop?',['for','html','body','img'],'for']], '1111-04':[['Tally is mainly used for?',['Accounting','Photo editing','Web design','Typing only'],'Accounting'],['A ledger contains?',['Account transactions','Images only','HTML tags','Drivers'],'Account transactions'],['Sales invoice is used to record?',['Sales','Hardware repair','Typing','Email'],'Sales'],['GST is related to?',['Goods and Services Tax','Graphic System Tool','General Software Test','Global Server Transfer'],'Goods and Services Tax'],['Voucher entry records?',['Business transactions','Screen brightness','Keyboard layout','Web pages'],'Business transactions']], '1111-05':[['Typing speed is commonly measured in?',['Words per minute','Bytes per second','Pixels per inch','Volts per minute'],'Words per minute'],['Touch typing means?',['Typing without looking at keys','Typing only on phone','Using one finger','Typing with mouse'],'Typing without looking at keys'],['Which improves accuracy?',['Regular practice','Random key pressing','Ignoring errors','Slow internet'],'Regular practice'],['Punjabi typing may use?',['Gurmukhi keyboard layout','Only English keys','Printer driver','HTML tags'],'Gurmukhi keyboard layout'],['Good typing posture includes?',['Straight back and relaxed hands','Bent wrists','Looking down constantly','Very tight grip'],'Straight back and relaxed hands']], '1111-06':[['Windows installation normally needs?',['Bootable installation media','Only calculator','HTML file','Email account'],'Bootable installation media'],['Ghost is used for?',['Disk imaging/cloning','Typing','Accounting','Web browsing'],'Disk imaging/cloning'],['RAM is?',['Temporary working memory','Permanent storage','Printer memory only','Internet cable'],'Temporary working memory'],['Which is hardware?',['Motherboard','Windows setting','HTML','Tally voucher'],'Motherboard'],['A device driver helps?',['OS communicate with hardware','Create invoices','Type Punjabi','Make websites'],'OS communicate with hardware']], '1111-07':[['Viva-voce is?',['Oral assessment','Online payment','File backup','Typing test only'],'Oral assessment'],['A practical lab tests?',['Hands-on skills','Only memory','Internet speed','Password length'],'Hands-on skills'],['Before submitting an assignment you should?',['Check your work','Delete it','Share password','Ignore errors'],'Check your work'],['Troubleshooting means?',['Finding and fixing problems','Printing pages','Creating email','Typing faster'],'Finding and fixing problems'],['A good viva answer should be?',['Clear and relevant','Random','Unrelated','Blank'],'Clear and relevant']]};const sel=document.getElementById('subject');SUBJECTS.forEach(s=>{const o=document.createElement('option');o.value=s[0];o.textContent=s[0]+' — '+s[1];sel.appendChild(o)});const f=document.getElementById('f');function render(){const Q=BANK[sel.value];f.innerHTML=Q.map((q,i)=>'<div class="q"><b>Q'+(i+1)+'. '+q[0]+'</b>'+q[1].map(o=>'<label class="op"><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,'&quot;')+'"> '+o+'</label>').join('')+'</div>').join('');document.getElementById('msg').textContent=''}sel.onchange=render;render();document.getElementById('submit').onclick=()=>{const Q=BANK[sel.value];let s=0;Q.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&a.value===q[2])s++});const p=s/Q.length*100,m=document.getElementById('msg');m.className='msg '+(p>=40?'ok':'bad');m.textContent='Mock '+sel.value+' • '+SUBJECTS.find(x=>x[0]===sel.value)[1]+' • Score: '+s+'/'+Q.length+' • '+p+'% • '+(p>=40?'PASS':'FAIL')};</script></body></html>
