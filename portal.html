<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy | Student Portal</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#14233b}.top{background:#082b5d;color:white;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:25px auto;padding:0 4%}.panel,.card{background:white;border:1px solid #dce6f2;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer;background:#082b5d;color:white}.gold{background:#f4b63f;color:#14233b}.field{display:grid;gap:6px;margin:10px 0}.field input{padding:11px;border:1px solid #ccd9e8;border-radius:9px}.muted{color:#66758c}.hidden{display:none}.price{font-size:24px;font-weight:bold;color:#082b5d}.ok{color:#16845d}.bad{color:#c43d59}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>BABA NANAK ACADEMY ONLINE</b><button class="btn gold" id="logout">Logout</button></header><main class="wrap"><section class="panel"><h1>Student Dashboard</h1><p class="muted">Registration → Login → Course → Razorpay Payment → Study → Exam → Result → Certificate</p></section><section class="panel" id="login"><h2>Student Login</h2><form id="loginForm"><div class="field"><label>Student ID</label><input id="studentId" required></div><div class="field"><label>Registered Email</label><input id="email" type="email" required></div><button class="btn">Login</button></form><p id="msg"></p><p class="muted">Not registered? <a href="admission.html">Register Student</a></p></section><section class="panel hidden" id="dash"><h2 id="welcome">Welcome</h2><div id="studentInfo"></div></section><section class="panel"><h2>Courses</h2><div id="courses" class="grid"><div class="card">Login first to load your courses.</div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let student=null;const $=id=>document.getElementById(id);async function call(action,data={},isPublic=false){const payload={action,...data};if(isPublic)payload.public=true;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({ok:false,message:'Invalid backend response'}));if(!d.ok)throw Error(d.message||'Backend request failed');return d}function msg(x,ok=false){$('msg').textContent=x;$('msg').className=ok?'ok':'bad'}async function loadCourses(){if(!student){return}try{const d=await call('courses',{studentId:student.studentId||student['Student ID']});const list=Array.isArray(d.courses)?d.courses:Array.isArray(d.data)?d.data:[];$('courses').innerHTML=list.length?list.map(c=>{const id=c.courseId||c.id||c['Course ID'];const name=c.course||c.name||c['Course']||'Course';const fee=Number(c.amount||c.fee||c['Fee']||0);return `<article class="card"><h3>${name}</h3><p class="muted">Course ID: ${id||'-'}</p><div class="price">₹${fee.toLocaleString('en-IN')}</div><button class="btn gold" onclick="pay('${String(id).replace(/'/g,"\\'")}','${String(name).replace(/'/g,"\\'")}',${fee})">Select & Pay</button></article>`}).join(''):'<div class="card">No courses returned by backend.</div>'}catch(e){$('courses').innerHTML='<div class="card"><b>Courses backend:</b><p class="muted">'+e.message+'</p></div>'}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await call('verifyStudent',{studentId:$('studentId').value.trim(),email:$('email').value.trim()},true);student=d.student||d.data||d;sessionStorage.setItem('bna_student',JSON.stringify(student));$('dash').classList.remove('hidden');$('login').classList.add('hidden');$('welcome').textContent='Welcome, '+(student.name||student.Name||'Student');$('studentInfo').innerHTML='<p><b>Student ID:</b> '+(student.studentId||student['Student ID']||$('studentId').value)+'</p><p><b>Email:</b> '+(student.email||student.Email||$('email').value)+'</p>';msg('Login successful.',true);loadCourses()}catch(e){msg(e.message)}};async function pay(courseId,course,amount){if(!student)return msg('Please login first.');try{const sid=student.studentId||student['Student ID']||$('studentId').value;const p=await call('createRazorpayOrder',{studentId:sid,courseId,course,amount});const rz=new Razorpay({key:p.keyId,amount:p.amount,currency:p.currency,order_id:p.orderId,name:'Baba Nanak Academy',description:course,handler:async r=>{try{await call('verifyRazorpayPayment',{studentId:sid,courseId,course,amount,razorpay_payment_id:r.razorpay_payment_id,razorpay_order_id:r.razorpay_order_id,razorpay_signature:r.razorpay_signature});alert('Payment successful. Enrollment marked Paid.');}catch(e){alert(e.message)}}});rz.open()}catch(e){alert(e.message)}}$('logout').onclick=()=>{sessionStorage.removeItem('bna_student');location.reload()};try{student=JSON.parse(sessionStorage.getItem('bna_student')||'null');if(student){$('login').classList.add('hidden');$('dash').classList.remove('hidden');$('welcome').textContent='Welcome, '+(student.name||student.Name||'Student');$('studentInfo').innerHTML='<p><b>Student ID:</b> '+(student.studentId||student['Student ID']||'-')+'</p><p><b>Email:</b> '+(student.email||student.Email||'-')+'</p>';loadCourses()}}catch(e){};</script></body></html>
