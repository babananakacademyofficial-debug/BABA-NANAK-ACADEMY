<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Student Portal</title><style>:root{--n:#082b5d;--b:#1674cf;--bg:#f4f7fb;--line:#dbe5ef;--ok:#176b4b;--bad:#a12d4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}header{background:var(--n);color:#fff;padding:18px 6%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#fff;text-decoration:none;font-weight:800;margin-left:15px}.wrap{width:min(1100px,92%);margin:25px auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #082b5d0d}.login{max-width:520px;margin:45px auto}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.btn{padding:13px 17px;border:0;border-radius:10px;background:var(--n);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.hide{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fff0f3;color:var(--bad)}.ok{background:#e9f8f2;color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{border:1px solid var(--line);border-radius:13px;padding:15px;background:#f9fbff}.item b{display:block;color:var(--n);margin-bottom:7px}.course{border:1px solid var(--line);border-radius:13px;padding:17px}.course b{color:var(--n);font-size:17px}.fee{font-weight:900;color:var(--b)}.row{padding:12px 0;border-bottom:1px solid #e5ebf2;display:flex;justify-content:space-between;gap:15px}.muted{color:#66758c}@media(max-width:600px){.row{display:block}.row>*{display:block;margin:3px 0}}
</style></head><body><header><b>BABA NANAK ACADEMY</b><nav><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="admission.html">Registration</a></nav></header><main class="wrap"><section id="login" class="card login"><h1>Student Login</h1><p class="muted">Use your Student ID and registered email.</p><form id="form"><div class="field"><label for="sid">Student ID</label><input id="sid" required placeholder="BNA202600001"></div><div class="field"><label for="email">Registered Email</label><input id="email" type="email" required></div><button class="btn" id="loginBtn">Login →</button></form><div id="loginMsg"></div></section><section id="dashboard" class="hide"><div class="card"><h1>Welcome, <span id="name">Student</span> 👋</h1><div class="grid"><div class="item"><b>Student ID</b><span id="showId"></span></div><div class="item"><b>Email</b><span id="showEmail"></span></div><div class="item"><b>Mobile</b><span id="showPhone"></span></div><div class="item"><b>Status</b><span id="showStatus"></span></div></div><p><button class="btn" id="logout">Logout</button></p></div><div class="card"><h2>My Enrollments</h2><div id="enrollments"></div></div><div class="card"><h2>My Payments</h2><div id="payments"></div></div><div class="card"><h2>Results</h2><div id="results"></div></div><div class="card"><h2>Certificates</h2><div id="certificates"></div></div><div class="card"><h2>Courses</h2><div id="courses" class="grid"></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const $=id=>document.getElementById(id);let me=null;async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('Invalid server response. Please check Apps Script deployment.')}}async function doLogin(id,email){const r=await api('verifyStudent',{studentId:id,email});if(!r.ok)throw Error(r.message||'Student verification failed.');me=r.student;sessionStorage.setItem('bna_student',JSON.stringify(me));renderStudent();await loadDashboard()}function renderStudent(){$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('name').textContent=me.name||'Student';$('showId').textContent=me.studentId||'';$('showEmail').textContent=me.email||'';$('showPhone').textContent=me.phone||'';$('showStatus').textContent=me.status||'Registered'}async function loadDashboard(){try{const d=await api('studentDashboard',me);if(!d.ok)throw Error(d.message||'Unable to load dashboard.');$('enrollments').innerHTML=listRows(d.enrollments,x=>'<b>'+x[3]+'</b> — '+x[5]+' — Payment: '+x[6]);$('payments').innerHTML=listRows(d.payments,x=>x[3]+' — ₹'+x[4]+' — '+x[7]);$('results').innerHTML=listRows(d.results,x=>x[5]+' — '+x[6]+'/'+x[7]+' — '+x[9]);$('certificates').innerHTML=listRows(d.certificates,x=>'<b>'+x[5]+'</b> — '+x[4]+' — Grade '+x[6]);$('courses').innerHTML=(d.courses||[]).map(c=>'<div class="course"><b>'+escapeHtml(c.name||c.course)+'</b><p class="fee">₹'+Number(c.fee||0).toLocaleString('en-IN')+'</p></div>').join('')||'<p class="muted">No courses available yet.</p>'}catch(e){$('enrollments').innerHTML='<div class="msg err">'+escapeHtml(e.message)+'</div>'}}function listRows(rows,fn){return (rows||[]).map(x=>'<div class="row">'+fn(x)+'</div>').join('')||'<p class="muted">No records yet.</p>'}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}$('form').onsubmit=async e=>{e.preventDefault();const id=$('sid').value.trim().toUpperCase(),email=$('email').value.trim().toLowerCase();$('loginBtn').disabled=true;$('loginBtn').textContent='Checking…';$('loginMsg').className='msg';$('loginMsg').textContent='Verifying student…';try{await doLogin(id,email);$('loginMsg').textContent=''}catch(err){$('loginMsg').className='msg err';$('loginMsg').textContent=err.message}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Login →'}};$('logout').onclick=()=>{sessionStorage.removeItem('bna_student');location.reload()};(async()=>{try{const x=sessionStorage.getItem('bna_student');if(x){me=JSON.parse(x);await doLogin(me.studentId,me.email)}}catch(e){sessionStorage.removeItem('bna_student')}})();</script></body></html>
