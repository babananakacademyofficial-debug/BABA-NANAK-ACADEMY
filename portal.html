<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Baba Nanak Academy Student Portal</title><script src='https://checkout.razorpay.com/v1/checkout.js'></script><style>body{font-family:Arial;margin:0;background:#f5f8fc;color:#122}header{background:#092a5b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #0001}input,button,select{padding:12px;border-radius:9px;border:1px solid #ccd6e3;margin:5px 0}button{background:#092a5b;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.course{border:1px solid #dce5ef;padding:16px;border-radius:12px}.hide{display:none}.msg{padding:10px;border-radius:9px;background:#eef6ff}.danger{background:#fff0f0;color:#a00}</style></head><body><header><b>BABA NANAK ACADEMY</b><span>Student Portal</span></header><main><section id='login' class='card'><h2>Student Login</h2><p>Use the Student ID and the same email used during registration.</p><input id='sid' placeholder='Student ID'><br><input id='email' type='email' placeholder='Registered Email'><br><button onclick='login()'>Login</button><div id='loginMsg'></div></section><section id='dash' class='hide'><div class='card'><h2>Welcome, <span id='name'></span></h2><p>Student ID: <b id='studentId'></b></p><button onclick='logout()'>Logout</button></div><div class='card'><h2>Courses</h2><div id='courses' class='grid'></div></div><div class='card'><h2>My Enrollments</h2><div id='enrollments'></div></div><div class='card'><h2>Results & Certificates</h2><div id='results'></div><div id='certificates'></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';let me=null;async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});return r.json()}function msg(t,bad=false){const x=document.getElementById('loginMsg');x.className=bad?'msg danger':'msg';x.textContent=t}async function login(){msg('Checking...');try{const r=await api('verifyStudent',{studentId:document.getElementById('sid').value,email:document.getElementById('email').value});if(!r.ok)return msg(r.message,true);me=r.student;sessionStorage.setItem('bna_student',JSON.stringify(me));show();load()}catch(e){msg('Connection error: '+e.message,true)}}function show(){document.getElementById('login').classList.add('hide');document.getElementById('dash').classList.remove('hide');document.getElementById('name').textContent=me.name;document.getElementById('studentId').textContent=me.studentId}async function load(){try{const c=await api('courses');if(!c.ok){document.getElementById('courses').innerHTML='<div class="msg danger">'+escapeHtml(c.message||'Unable to load courses.')+'</div>';return}const list=Array.isArray(c.courses)?c.courses:[];if(!list.length){document.getElementById('courses').innerHTML='<div class="msg">No courses available yet. Please contact Baba Nanak Academy.</div>'}else{document.getElementById('courses').innerHTML=list.map(function(x){const courseId=x.courseId!==undefined&&x.courseId!==''?x.courseId:x.id;const courseName=x.course||x.name||x.title||'Course';const fee=Number(x.fee||0);return '<div class="course"><b>'+escapeHtml(courseName)+'</b><p>Fee: ₹'+fee+'</p><button onclick="pay(\''+escapeAttr(courseId)+'\')">Pay & Enrol</button></div>'}).join('')}const d=await api('studentDashboard',me);if(d&&d.ok!==false){document.getElementById('enrollments').innerHTML=(d.enrollments||[]).map(x=>'<p><b>'+escapeHtml(x[3]||'Course')+'</b> — '+escapeHtml(x[5]||'')+' — Payment: '+escapeHtml(x[6]||'')+'</p>').join('')||'No enrolments yet.';document.getElementById('results').innerHTML=(d.results||[]).map(x=>'<p>'+escapeHtml(x[4]||'')+' — '+escapeHtml(x[9]||'')+' — '+escapeHtml(x[8]||'')+'%</p>').join('')||'No results yet.';document.getElementById('certificates').innerHTML=(d.certificates||[]).map(x=>'<p>Certificate: <b>'+escapeHtml(x[5]||'')+'</b> — '+escapeHtml(x[4]||'')+'</p>').join('')||'No certificates yet.'}else{document.getElementById('enrollments').textContent='No enrolments yet.';document.getElementById('results').textContent='No results yet.';document.getElementById('certificates').textContent='No certificates yet.'}}catch(e){document.getElementById('courses').innerHTML='<div class="msg danger">Connection error: '+escapeHtml(e.message)+'</div>'}}async function pay(id){const r=await api('createRazorpayOrder',{studentId:me.studentId,courseId:id});if(!r.ok)return alert(r.message);const o=new Razorpay({key:r.keyId,amount:r.amount,currency:r.currency,name:'Baba Nanak Academy',description:r.course&&r.course.name?r.course.name:'Course',order_id:r.orderId,prefill:{name:me.name,email:me.email,contact:me.phone},handler:async function(res){const v=await api('verifyRazorpayPayment',Object.assign({studentId:me.studentId,courseId:id},res));alert(v.message);if(v.ok)load()}});o.open()}function logout(){sessionStorage.removeItem('bna_student');location.reload()}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function escapeAttr(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")} (function(){try{me=JSON.parse(sessionStorage.getItem('bna_student'));if(me){show();load()}}catch(e){}}) </script></body></html>
