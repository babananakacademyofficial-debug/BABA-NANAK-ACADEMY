<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy | Student Portal</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>:root{--n:#082b5d;--g:#f4b63f;--bg:#f5f8fc;--line:#dce6f2;--mut:#66758c;--ok:#1d8a61;--bad:#c43d59}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#14233b}.top{background:var(--n);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{width:min(1150px,92%);margin:25px auto}.brand{font-weight:900}.brand small{display:block;color:#8fd0ff;font-size:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--n);color:#fff}.gold{background:var(--g);color:#14233b}.danger{background:#fff0f3;color:var(--bad)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f7faff;border:1px solid var(--line);border-radius:13px;padding:15px}.stat b{font-size:25px;color:var(--n);display:block}.muted{color:var(--mut);font-size:13px}.price{font-size:25px;font-weight:900;color:var(--n)}.field{display:grid;gap:6px;margin:10px 0}.field input{padding:11px;border:1px solid #ccd9e8;border-radius:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.hidden{display:none!important}.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.q label{display:block;padding:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start}}@media(max-width:550px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">BABA NANAK ACADEMY ONLINE<small>STUDENT PORTAL • LEARN | PRACTICE | TEST | SUCCEED</small></div><div><button class="btn gold" id="authBtn">Login / Register</button><button class="btn danger hidden" id="logoutBtn">Logout</button></div></header><main class="wrap"><div class="panel"><h1>Student Dashboard</h1><p class="muted">Registration → Course → Razorpay Payment → Study → Exam → Result → DMC → Certificate</p></div><section id="login" class="panel hidden"><div class="grid"><form id="reg" class="card"><h2>New Registration</h2><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><button class="btn primary">Create Account</button></form><form id="loginForm" class="card"><h2>Student Login</h2><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn gold">Login</button></form></div></section><section class="panel"><h2>Courses</h2><div id="courses" class="grid"></div></section><section id="dash" class="hidden"><div class="stats"><div class="stat"><b id="en">0</b>Enrollments</div><div class="stat"><b id="ac">0</b>Active Courses</div><div class="stat"><b id="at">0</b>Exam Attempts</div><div class="stat"><b id="ce">0</b>Certificates</div></div><div class="tabs"><button class="btn primary" onclick="tab('learn')">My Learning</button><button class="btn gold" onclick="tab('res')">Results</button><button class="btn gold" onclick="tab('dmc')">DMC</button><button class="btn gold" onclick="tab('cert')">Certificates</button></div><div id="learn" class="panel"></div><div id="res" class="panel hidden"></div><div id="dmc" class="panel hidden"></div><div id="cert" class="panel hidden"></div></section><section id="exam" class="panel hidden"></section></main><script>let API=localStorage.getItem('bna_api')||'http://localhost:3000',TOKEN=localStorage.getItem('bna_token')||'';const $=s=>document.querySelector(s),api=async(p,o={})=>{const h={'Content-Type':'application/json',...(o.headers||{})};if(TOKEN)h.Authorization='Bearer '+TOKEN;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d};function toast(x){alert(x)}function tab(id){['learn','res','dmc','cert'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function authUI(){if(TOKEN){$('#authBtn').classList.add('hidden');$('#logoutBtn').classList.remove('hidden')}else{$('#authBtn').classList.remove('hidden');$('#logoutBtn').classList.add('hidden')}}async function courses(){try{const d=await api('/api/courses');$('#courses').innerHTML=d.map(c=>`<article class="card"><h3>${c.name}</h3><p class="muted">${c.description||''}</p><p>${c.duration||''}</p><div class="price">₹${Number(c.fee).toLocaleString('en-IN')}</div><button class="btn gold" onclick="buy(${c.id})">Select & Pay with Razorpay</button></article>`).join('')}catch(e){$('#courses').innerHTML='<div class="card"><b>Backend not connected.</b><p class="muted">Open API Settings by setting bna_api in browser storage to your deployed backend URL.</p></div>'}}async function buy(courseId){if(!TOKEN){$('#login').classList.remove('hidden');scrollTo(0,0);return toast('Please login/register first.')}try{await api('/api/enrollments',{method:'POST',body:JSON.stringify({courseId})});const p=await api('/api/payments/create-order',{method:'POST',body:JSON.stringify({courseId})});if(p.provider!=='razorpay')throw Error('Razorpay is not configured.');const options={key:p.keyId,amount:p.amount,currency:p.currency,name:p.name,description:p.description,order_id:p.orderId,prefill:p.prefill,theme:{color:'#082b5d'},handler:async function(r){try{await api('/api/payments/verify',{method:'POST',body:JSON.stringify({paymentDbId:p.paymentDbId,paymentId:r.razorpay_payment_id,razorpayOrderId:r.razorpay_order_id,signature:r.razorpay_signature})});toast('Payment successful. Course activated automatically.');dashboard()}catch(e){toast(e.message)}},modal:{ondismiss:function(){toast('Payment window closed. No course access was granted.')}}};const rz=new Razorpay(options);rz.on('payment.failed',e=>toast('Payment failed: '+(e.error?.description||'Please try again.')));rz.open()}catch(e){toast(e.message)}}async function dashboard(){if(!TOKEN)return;try{const d=await api('/api/student/dashboard');$('#dash').classList.remove('hidden');$('#en').textContent=d.enrollments.length;$('#ac').textContent=d.enrollments.filter(x=>x.status==='active').length;$('#ce').textContent=d.certificates.length;const rr=await api('/api/student/results');$('#at').textContent=rr.results.length;$('#learn').innerHTML='<h2>My Learning</h2>'+d.enrollments.map(e=>`<div class="lesson"><div><b>${e.name}</b><div class="muted">${e.duration||''} • ${e.status}</div></div>${e.status==='active'?`<button class="btn primary" onclick="course(${e.course_id})">Open Course</button>`:'<span class="muted">Payment pending</span>'}</div>`).join('')||'<p class="muted">No courses enrolled yet.</p>';$('#res').innerHTML='<h2>Results</h2>'+rr.results.map(r=>`<div class="lesson"><span><b>${r.course_name}</b><br><small>${r.title}</small></span><b class="${r.passed?'ok':'bad'}">${r.percentage}% • ${r.passed?'PASS':'FAIL'}</b></div>`).join('')||'<p>No results yet.</p>';$('#dmc').innerHTML='<h2>Digital Marks Card</h2><div class="card"><b>'+d.student.name+'</b><p>'+d.student.email+'</p>'+rr.results.map(r=>`<p>${r.course_name}: ${r.score}/${r.total} — ${r.percentage}% — ${r.passed?'PASS':'FAIL'}</p>`).join('')+'<button class="btn gold" onclick="print()">Print / Save DMC</button></div>';$('#cert').innerHTML='<h2>Certificates</h2>'+d.certificates.map(c=>`<div class="lesson"><span><b>${c.course_name}</b><br><small>${c.certificate_no} • Grade ${c.grade}</small></span><a href="certificate.html?no=${encodeURIComponent(c.certificate_no)}" target="_blank">Open Certificate</a></div>`).join('')||'<p>Certificate is generated automatically after a passing exam.</p>'}catch(e){localStorage.removeItem('bna_token');TOKEN='';authUI()}}async function course(id){try{const d=await api('/api/student/courses/'+id+'/content');$('#learn').innerHTML='<h2>'+d.course.name+'</h2>'+d.lessons.map(l=>`<div class="lesson"><span><b>${l.title}</b><br><small>${l.completed?'Completed':'Not completed'}</small></span><button class="btn ${l.completed?'primary':'gold'}" onclick="complete(${l.id},${id})">${l.completed?'Completed':'Mark Complete'}</button></div>`).join('')+(d.exam?`<button class="btn primary" onclick="startExam(${d.exam.id})">Start Final Exam</button>`:'')}catch(e){toast(e.message)}}async function complete(lessonId,courseId){try{await api('/api/student/progress',{method:'POST',body:JSON.stringify({lessonId})});course(courseId)}catch(e){toast(e.message)}}async function startExam(id){try{const d=await api('/api/student/exams/'+id);$('#exam').classList.remove('hidden');$('#exam').innerHTML='<h2>'+d.exam.title+'</h2><p>Timer: '+d.exam.duration_minutes+' minutes • Pass: '+d.exam.pass_percent+'%</p><form id="examForm">'+d.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${q.question}</b>${['A','B','C','D'].map(k=>`<label><input required type="radio" name="q${q.id}" value="${k}"> ${q['option_'+k.toLowerCase()]}</label>`).join('')}</div>`).join('')+'<button class="btn primary">Submit Exam</button></form>';$('#examForm').onsubmit=async e=>{e.preventDefault();const a={};new FormData(e.target).forEach((v,k)=>a[k.slice(1)]=v);try{const r=await api('/api/student/exams/'+id+'/submit',{method:'POST',body:JSON.stringify({answers:a,startedAt:new Date().toISOString()})});$('#exam').innerHTML=`<h2>Result</h2><div class="card"><div class="price">${r.result.percentage}%</div><p>Score: ${r.result.score}/${r.result.total}</p><p class="${r.result.passed?'ok':'bad'}">${r.result.passed?'PASS':'FAIL'}</p>${r.certificate?`<p>Certificate: <b>${r.certificate.certificate_no}</b></p>`:''}</div>`;dashboard()}catch(x){toast(x.message)}}}catch(e){toast(e.message)}}$('#reg').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});TOKEN=d.token;localStorage.setItem('bna_token',TOKEN);$('#login').classList.add('hidden');authUI();dashboard()}catch(x){toast(x.message)}};$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});TOKEN=d.token;localStorage.setItem('bna_token',TOKEN);$('#login').classList.add('hidden');authUI();dashboard()}catch(x){toast(x.message)}};$('#authBtn').onclick=()=>$('#login').classList.toggle('hidden');$('#logoutBtn').onclick=()=>{localStorage.removeItem('bna_token');location.reload()};authUI();courses();dashboard();</script></body></html>
