<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Online Student System</title><style>:root{--n:#082b5d;--b:#1674cf;--g:#f4b63f;--bg:#f4f7fb;--line:#dbe5ef;--ok:#176b4b;--bad:#a12d4d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17263d}header{background:var(--n);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header a{color:#fff;text-decoration:none;font-weight:800;margin-left:12px}.wrap{width:min(1150px,94%);margin:22px auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 10px 30px #082b5d0d}.login{max-width:520px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.btn{padding:11px 15px;border:0;border-radius:10px;background:var(--n);color:#fff;font-weight:900;cursor:pointer}.gold{background:var(--g);color:#17263d}.blue{background:var(--b)}.hide{display:none!important}.msg{padding:12px;border-radius:10px;margin-top:10px}.ok{background:#e9f8f2;color:var(--ok)}.err{background:#fff0f3;color:var(--bad)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.tile{background:#f9fbff;border:1px solid var(--line);border-radius:13px;padding:16px}.tile b{display:block;color:var(--n);margin-bottom:6px}.course{border:1px solid var(--line);border-radius:14px;padding:17px}.course h3{margin:0;color:var(--n)}.fee{font-size:18px;font-weight:900;color:var(--b)}.lesson,.question{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.lesson.done{border-left:5px solid var(--ok)}.lesson h4,.question h4{margin:0 0 8px}.option{display:block;margin:7px 0;padding:9px;background:#f5f8fc;border-radius:8px}.result{font-size:22px;font-weight:900;color:var(--n)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #dce4ec;padding:8px;text-align:left}th{background:#eef5ff}.muted{color:#66758c}.verify{color:var(--b);font-weight:900;text-decoration:none}@media(max-width:600px){header nav{width:100%}header a{margin:0 10px 0 0}.card{padding:15px}}</style></head><body><header><b>BABA NANAK ACADEMY ONLINE</b><nav><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="admission.html">Registration</a></nav></header><main class="wrap"><section id="login" class="card login"><h1>🎓 Student Login</h1><p class="muted">Student ID + registered email required.</p><form id="loginForm"><div class="field"><label>Student ID</label><input id="sid" placeholder="BNA202600001" required></div><div class="field"><label>Registered Email</label><input id="email" type="email" required></div><button class="btn">LOGIN TO ONLINE SYSTEM</button></form><div id="loginMsg"></div></section><section id="app" class="hide"><div class="card"><div class="grid"><div class="tile"><b>Student</b><span id="sname"></span></div><div class="tile"><b>Student ID</b><span id="showId"></span></div><div class="tile"><b>Fee</b><span>₹0 — DIRECT ONLINE ENROLLMENT</span></div><div class="tile"><b>Status</b><span id="status"></span></div></div><br><button class="btn" id="logout">LOGOUT</button></div><div class="card"><div class="tabs"><button class="btn" onclick="tab('home')">DASHBOARD</button><button class="btn" onclick="tab('courses')">COURSES & FEE</button><button class="btn" onclick="tab('study')">📚 STUDY MATERIAL</button><button class="btn" onclick="tab('mock')">📝 MOCK TEST / EXAM</button><button class="btn" onclick="tab('results')">📊 RESULT</button><button class="btn" onclick="tab('cert')">🏆 CERTIFICATE</button></div><div id="view"></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const VERIFY='https://babananakacademyofficial-debug.github.io/BABA-NANAK-ACADEMY/verify.html';const $=id=>document.getElementById(id);let me=null,dash=null,selectedCourse='1111';const ADCA=[['1111-01','Computer Fundamental',100],['1111-02','Desktop Publishing',100],['1111-03','HTML, C++',100],['1111-04','Tally ERP 9.0',100],['1111-05','Typing English/Punjabi',100],['1111-06','Installation Windows, Windows Ghost, Hardware',100],['1111-07','Practical Lab Assignment & Viva-Voce',400]];const Q=[['What is the main input device for typing?',['Monitor','Keyboard','Speaker','Printer'],'Keyboard'],['Which is used to create a presentation?',['MS PowerPoint','Notepad','Calculator','Paint'],'MS PowerPoint'],['HTML is mainly used for?',['Web page structure','Antivirus','Accounting','Typing only'],'Web page structure'],['Which software is used for accounting?',['Tally','Paint','Browser','Calculator'],'Tally'],['Which is a safe password practice?',['123456','Your name','Unique long password','Share password'],'Unique long password']];async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('Server response invalid.')}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function show(id,t,c=''){if($(id)){$(id).className=c?'msg '+c:'msg';$(id).textContent=t}}async function login(){const id=$('sid').value.trim().toUpperCase(),email=$('email').value.trim().toLowerCase();try{show('loginMsg','Checking student…');const r=await api('verifyStudent',{studentId:id,email});if(!r.ok)throw Error(r.message||'Student verification failed.');me=r.student;sessionStorage.setItem('bna_online_student',JSON.stringify(me));await refresh();$('login').classList.add('hide');$('app').classList.remove('hide');tab('home')}catch(e){show('loginMsg',e.message,'err')}}$('loginForm').onsubmit=e=>{e.preventDefault();login()};$('logout').onclick=()=>{sessionStorage.removeItem('bna_online_student');location.reload()};async function refresh(){dash=await api('studentDashboard',me);if(!dash.ok)throw Error(dash.message||'Dashboard unavailable');$('sname').textContent=me.name||'Student';$('showId').textContent=me.studentId||'';$('status').textContent=me.status||'Registered'}function tab(k){if(k==='home')home();if(k==='courses')courses();if(k==='study')study();if(k==='mock')mock();if(k==='results')results();if(k==='cert')cert()}function home(){$('view').innerHTML='<h2>📊 Student Dashboard</h2><div class="grid"><div class="tile"><b>My Enrollments</b><span>'+((dash.enrollments||[]).length||0)+'</span></div><div class="tile"><b>Payments</b><span>'+((dash.payments||[]).length||0)+' record(s)</span></div><div class="tile"><b>Results</b><span>'+((dash.results||[]).length||0)+' subject result(s)</span></div><div class="tile"><b>Certificates</b><span>'+((dash.certificates||[]).length||0)+'</span></div></div><div class="card"><h3>ONLINE FLOW</h3><p>Registration → Course → ₹0 Fee → Enrollment → Study Material → Mock Test / Exam → Result → Certificate → QR Verify</p></div>'}function courses(){const rows=(dash.courses||[]);$('view').innerHTML='<h2>📚 Courses & Fee</h2><p class="muted">All online course fees are currently ₹0 for direct enrollment/testing.</p><div class="grid">'+rows.map(c=>'<div class="course"><h3>'+esc(c.name)+'</h3><p>Course ID: <b>'+esc(c.id)+'</b></p><p class="fee">₹0</p><button class="btn gold" onclick="enroll(\''+esc(c.id)+'\')">ENROLL NOW</button></div>').join('')+'</div>'}async function enroll(cid){try{const r=await api('enrollment',{studentId:me.studentId,courseId:cid});if(!r.ok)throw Error(r.message||'Enrollment failed.');selectedCourse=String(cid);await refresh();alert('✓ '+r.message);study()}catch(e){alert(e.message)}}function active(cid){return(dash.enrollments||[]).some(r=>String(r[2])===String(cid)&&String(r[5]).toUpperCase()==='ACTIVE')}function study(){selectedCourse=selectedCourse||'1111';const enrolled=active(selectedCourse);if(!enrolled){$('view').innerHTML='<h2>📚 Study Material</h2><div class="msg err">Please enroll in a course first. Course fee: ₹0.</div><button class="btn" onclick="courses()">GO TO COURSES</button>';return}if(selectedCourse!=='1111'){$('view').innerHTML='<h2>📚 Study Material</h2><p>Course <b>'+esc(selectedCourse)+'</b> is enrolled. Study modules will appear here when course material is added.</p>';return}const materials=[['Computer Fundamental','Computer basics, operating system, files, folders, hardware and software.'],['Desktop Publishing','DTP concepts, page layout, text formatting, graphics and printing.'],['HTML & C++','HTML structure, tags, forms, basic C++ programming concepts.'],['Tally ERP 9.0','Company creation, ledgers, vouchers, reports and basic accounting.'],['Typing English/Punjabi','Daily typing practice, speed, accuracy and keyboard skills.'],['Windows + Hardware','Windows installation, Ghost, drivers, hardware identification and troubleshooting.'],['Practical + Viva','Lab assignments, practical work and viva-voce preparation.']];$('view').innerHTML='<h2>📚 ADCA Study Material</h2><p class="muted">Course ID 1111 • 7 modules</p>'+materials.map((m,i)=>'<div class="lesson"><h4>Module '+(i+1)+': '+esc(m[0])+'</h4><p>'+esc(m[1])+'</p><button class="btn blue" onclick="mark('+i+')">MARK STUDIED</button></div>').join('')}function mark(i){alert('✓ Module '+(i+1)+' marked for study practice.')}function mock(){$('view').innerHTML='<h2>📝 Mock Test / Exam</h2><p>ADCA practice exam • 5 questions • 1 mark each • Pass target 40%</p><form id="examForm">'+Q.map((q,i)=>'<div class="question"><h4>Q'+(i+1)+'. '+esc(q[0])+'</h4>'+q[1].map(o=>'<label class="option"><input type="radio" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join('')+'</div>').join('')+'<button class="btn gold">SUBMIT MOCK EXAM</button></form><div id="examMsg"></div>';$('examForm').onsubmit=e=>{e.preventDefault();let score=0;Q.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&a.value===q[2])score++});const pct=score/Q.length*100;show('examMsg','Score: '+score+'/'+Q.length+' • '+pct+'% • '+(pct>=40?'PASS':'FAIL'),pct>=40?'ok':'err')}}function results(){const r=(dash.results||[]);$('view').innerHTML='<h2>📊 My Result</h2>'+(r.length?'<table><tr><th>Subject</th><th>Marks</th><th>Total</th><th>Percentage</th><th>Result</th></tr>'+r.map(x=>'<tr><td>'+esc(x[6])+'</td><td>'+esc(x[7])+'</td><td>'+esc(x[8])+'</td><td>'+esc(x[9])+'%</td><td>'+esc(x[10])+'</td></tr>').join('')+'</table>':'<p class="muted">No result uploaded yet. Admin will upload subject-wise marks.</p>')}function cert(){const r=dash.certificates||[];$('view').innerHTML='<h2>🏆 My Certificate</h2>'+(r.length?r.map(x=>{const no=x[5]||'',u=VERIFY+'?certificateNo='+encodeURIComponent(no);return '<div class="tile"><b>Certificate No: '+esc(no)+'</b><p>Course: '+esc(x[4])+'</p><p>Grade: <b>'+esc(x[6])+'</b></p><a class="verify" href="'+u+'" target="_blank">🔎 VERIFY CERTIFICATE / QR PAGE →</a></div>'}).join(''):'<p class="muted">Certificate will appear here after result/certificate processing.</p>')} (async()=>{try{const x=sessionStorage.getItem('bna_online_student');if(x){me=JSON.parse(x);await refresh();$('login').classList.add('hide');$('app').classList.remove('hide');tab('home')}}catch(e){sessionStorage.removeItem('bna_online_student')}})();</script></body></html>
