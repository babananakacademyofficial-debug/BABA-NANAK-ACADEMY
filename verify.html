<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification | Baba Nanak Academy</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f8fc;color:#14233b}.wrap{width:min(650px,92%);margin:8vh auto}.card{background:#fff;border:1px solid #dce6f2;border-radius:22px;padding:28px;box-shadow:0 18px 55px #0a2b5d12}.brand{color:#082b5d;font-weight:900;letter-spacing:.5px}.field{display:flex;gap:8px;margin:18px 0}.field input{flex:1;padding:13px;border:1px solid #ccd9e8;border-radius:10px;font:inherit}.btn{padding:13px 17px;border:0;border-radius:10px;background:#082b5d;color:#fff;font-weight:900;cursor:pointer}.result{padding:18px;border-radius:14px;background:#f7faff}.ok{border:1px solid #a7dcc8;background:#f4fcf8}.bad{border:1px solid #efb3bf;background:#fff5f7}.row{display:flex;justify-content:space-between;border-bottom:1px solid #e5ebf3;padding:10px 0}.muted{color:#66758c;font-size:13px}</style></head><body><main class="wrap"><div class="card"><div class="brand">BABA NANAK ACADEMY ONLINE</div><h1>Certificate Verification</h1><p class="muted">Enter the certificate ID printed on the student's certificate.</p><div class="field"><input id="no" placeholder="BNA/2026/000001"><button class="btn" onclick="verify()">Verify</button></div><div id="result"></div></div></main><script>const API=localStorage.getItem('bna_api')||'http://localhost:3000';async function verify(){const no=document.getElementById('no').value.trim();const out=document.getElementById('result');if(!no)return;try{const r=await fetch(API+'/api/verify/'+encodeURIComponent(no));const d=await r.json();if(!r.ok)throw Error(d.message);const c=d.certificate;out.innerHTML=`<div class="result ok"><h2>✓ VALID CERTIFICATE</h2><div class="row"><b>Student</b><span>${c.student_name}</span></div><div class="row"><b>Course</b><span>${c.course_name}</span></div><div class="row"><b>Certificate ID</b><span>${c.certificate_no}</span></div><div class="row"><b>Grade</b><span>${c.grade}</span></div><div class="row"><b>Issued</b><span>${c.issued_at}</span></div></div>`}catch(e){out.innerHTML=`<div class="result bad"><h2>✕ Certificate not found</h2><p class="muted">${e.message}</p></div>`}}</script></body></html>
