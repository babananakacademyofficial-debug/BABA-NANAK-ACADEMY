<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baba Nanak Academy — Official Exam</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#17263d}.wrap{width:min(900px,94%);margin:30px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 10px 30px #082b5d10}h1,h2{color:#082b5d}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}.q{border:1px solid #dbe5ef;border-radius:12px;padding:15px;margin:12px 0}.op{display:block;padding:9px;background:#f6f9fd;margin:7px 0;border-radius:8px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#082b5d;color:#fff;font-weight:900;cursor:pointer}.msg{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#e8f8f0;color:#176b4b}.bad{background:#fff0f3;color:#a12d4d}.muted{color:#66758c}a{color:#1674cf;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><div class="card"><h1>🎓 OFFICIAL EXAM</h1><p class="muted">Official exam is separate from Mock Test. Submit once; final result is stored in the Google Sheet through the Academy backend.</p><div class="field"><label>Student ID *</label><input id="sid" placeholder="BNA202600001"></div><div class="field"><label>Registered Email *</label><input id="email" type="email"></div><div class="field"><label>Course</label><select id="course"><option value="1111">1111 — ADCA</option></select></div><form id="f"></form><button class="btn" id="submit">SUBMIT OFFICIAL EXAM</button><div id="msg"></div><p><a href="mock.html">← Mock Test</a> &nbsp; <a href="online.html">Online Student</a></p></div></main><script>const API='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';const Q=[['Computer Fundamental: Which is an input device?',['Keyboard','Monitor','Printer','Speaker'],'Keyboard'],['Desktop Publishing is mainly used for?',['Page layout and publishing','Only accounting','Only antivirus','Only email'],'Page layout and publishing'],['HTML is used mainly to build?',['Web page structure','Bank account','Hardware','Operating system'],'Web page structure'],['Tally ERP is used mainly for?',['Accounting','Photo editing','Video games','Web browsing'],'Accounting'],['Windows Ghost is related to?',['System imaging/cloning','Typing','Presentation','Email'],'System imaging/cloning'],['Which improves typing performance?',['Accuracy and regular practice','Random passwords','Deleting files','Turning off monitor'],'Accuracy and regular practice'],['Viva-voce means?',['Oral/practical assessment','Online payment','File backup','Web design only'],'Oral/practical assessment'],['Which is computer hardware?',['Keyboard','HTML','Tally company','Windows setting'],'Keyboard'],['A strong password should be?',['Long and unique','123456','Your name','Shared publicly'],'Long and unique'],['Which is an operating system?',['Windows','HTML','Tally voucher','Keyboard'],'Windows']];const f=document.getElementById('f');f.innerHTML=Q.map((q,i)=>'<div class="q"><b>Q'+(i+1)+'. '+q[0]+'</b>'+q[1].map(o=>'<label class="op"><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,'&quot;')+'"> '+o+'</label>').join('')+'</div>').join('');async function api(action,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('Server response invalid.')}}document.getElementById('submit').onclick=async()=>{const sid=document.getElementById('sid').value.trim().toUpperCase(),email=document.getElementById('email').value.trim().toLowerCase(),courseId=document.getElementById('course').value;const m=document.getElementById('msg');if(!sid||!email){m.className='msg bad';m.textContent='Student ID and registered email are required.';return}let score=0;Q.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&a.value===q[2])score++});const pct=score/Q.length*100;document.getElementById('submit').disabled=true;m.className='msg';m.textContent='Submitting exam result…';try{const r=await api('examSubmit',{studentId:sid,email,courseId,score,total:Q.length,percentage:pct,result:pct>=40?'PASS':'FAIL',examType:'OFFICIAL EXAM'});if(!r.ok)throw Error(r.message||'Exam result could not be saved.');m.className='msg ok';m.textContent='✓ EXAM SUBMITTED • Score '+score+'/'+Q.length+' • '+pct+'% • '+(pct>=40?'PASS':'FAIL')+' • Result saved in Google Sheet.'}catch(e){m.className='msg bad';m.textContent=e.message}finally{document.getElementById('submit').disabled=false}};</script></body></html>
