<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Registration | Baba Nanak Academy Online</title>
<style>
:root{--navy:#092a5b;--blue:#1671c9;--gold:#f4b63f;--bg:#f6f9fd;--line:#d8e3ef;--muted:#65758c;--green:#208a62;--red:#c83f62}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#fff);color:#14233b}.wrap{width:min(760px,92%);margin:45px auto}.brand{text-align:center;color:var(--navy);font-weight:900;font-size:26px}.sub{text-align:center;color:var(--blue);font-weight:800;font-size:12px;letter-spacing:1px;margin:5px 0 25px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(10,43,88,.1)}h1{margin:0;color:var(--navy);font-size:30px}.intro{color:var(--muted);margin:8px 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#40516d}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e7f3ff}textarea{min-height:90px;resize:vertical}.honeypot{display:none}.actions{margin-top:22px;display:flex;justify-content:flex-end}.btn{border:0;border-radius:12px;padding:13px 22px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:18px;padding:13px;border-radius:11px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#eaf8f2;color:#176b4b}.error{background:#fff0f3;color:#a12d4d}.student{font-family:monospace;background:#f2f7fc;padding:4px 7px;border-radius:6px}
@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{margin:25px auto}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">BABA NANAK ACADEMY ONLINE</div>
  <div class="sub">STUDENT REGISTRATION</div>
  <section class="card">
    <h1>Create your student account</h1>
    <p class="intro">Register once. Your student ID will be generated automatically and your registration will be recorded in the academy system.</p>
    <form id="registrationForm" novalidate>
      <div class="grid">
        <div class="field"><label for="name">Full Name *</label><input id="name" name="name" required maxlength="100" autocomplete="name"></div>
        <div class="field"><label for="phone">Mobile Number *</label><input id="phone" name="phone" required maxlength="30" autocomplete="tel"></div>
        <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required maxlength="160" autocomplete="email"></div>
        <div class="field"><label for="dob">Date of Birth</label><input id="dob" name="dob" type="date"></div>
        <div class="field full"><label for="address">Address</label><textarea id="address" name="address" maxlength="300"></textarea></div>
        <div class="honeypot"><label>Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      </div>
      <div class="actions"><button class="btn" id="submitBtn" type="submit">Register Student</button></div>
      <div id="message" class="msg"></div>
    </form>
  </section>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwETCN_PWOYtigRvNQrdWjpVwrS1Du4oAOQU6EX3QmyTYKpMdo9gt-rmnFiwbJxQgseKg/exec';
const form=document.getElementById('registrationForm');
const btn=document.getElementById('submitBtn');
const msg=document.getElementById('message');
function show(type,text){msg.className='msg show '+type;msg.innerHTML=text}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!form.reportValidity()) return;
  btn.disabled=true;btn.textContent='Registering...';msg.className='msg';
  const data=Object.fromEntries(new FormData(form).entries());
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'registration',public:true,data})});
    const json=await res.json();
    if(!json.ok) throw new Error(json.message||'Registration failed');
    show('success','Registration successful! Your Student ID is <span class="student">'+json.studentId+'</span>. Please keep it safe.');
    form.reset();
  }catch(err){show('error',err.message||'Unable to complete registration. Please try again.')}finally{btn.disabled=false;btn.textContent='Register Student'}
});
</script>
</body>
</html>
